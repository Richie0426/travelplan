  <!-- Phase 6:Service Worker 註冊 + 安裝提示 -->
  <script>
    // 記錄 beforeinstallprompt 事件供 React 端讀取
    window._installPromptEvent = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window._installPromptEvent = e;
      window.dispatchEvent(new CustomEvent('installPromptReady'));
    });
    window.addEventListener('appinstalled', () => {
      window._installPromptEvent = null;
      window.dispatchEvent(new CustomEvent('installCompleted'));
    });

    // 註冊 SW:僅 https 部署環境註冊;localhost 開發時跳過(避免快取擋住即時修改)
    // 同時:若 localhost 上已有舊 SW,主動 unregister 一次,讓開發體驗乾淨
    const _isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if ('serviceWorker' in navigator) {
      if (_isLocalhost) {
        // 開發環境:取消註冊 + 清快取
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        });
        if (window.caches) {
          caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
        }
      } else if (location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then((reg) => {
              console.log('[SW] registered, scope:', reg.scope);
              reg.addEventListener('updatefound', () => {
                const installing = reg.installing;
                if (installing) {
                  installing.addEventListener('statechange', () => {
                    if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                      window.dispatchEvent(new CustomEvent('swUpdateAvailable'));
                    }
                  });
                }
              });
            })
            .catch((err) => console.warn('[SW] registration failed', err));
        });
      }
    }
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    // ================================================================
    // 常數
    // ================================================================
    const ICON_OPTIONS = ['🚙', '🚗', '🚐', '🛻', '🏍️', '🚌', '🚲', '✨'];
    const COLOR_OPTIONS = [
      { name: '藍', value: '#3B82F6' },
      { name: '紅', value: '#EF4444' },
      { name: '綠', value: '#10B981' },
      { name: '橘', value: '#F59E0B' },

      { name: '粉', value: '#EC4899' },
    ];
    const LS_VIEWER_PROFILE_PREFIX = 'tw-travel-viewer-profile:';

    // ---- Phase 2:POI 與搜尋 ----
    const POI_CACHE_KEY = 'tw-travel-poi-cache';
    const POI_CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000; // 7 天
    const POI_APIS = [
      { url: 'https://media.taiwan.net.tw/XMLReleaseALL_public/scenic_spot_C_f.json', category: 'scenic', label: '景點' },
      { url: 'https://media.taiwan.net.tw/XMLReleaseALL_public/restaurant_C_f.json', category: 'restaurant', label: '餐廳' },

      restaurant: 90,

      { value: 'lodging', label: '🏨 住宿' },

      { value: 'parking', label: '🅿️ 停車' },

    ];

    // ================================================================
    // Firebase 初始化
    // ================================================================
    let firebaseInitError = null;
    try {
      if (!window.firebaseConfig) {
        throw new Error('找不到 config.js 或 window.firebaseConfig 未設定');
      }
      firebase.initializeApp(window.firebaseConfig);
    } catch (e) {

    }

    // ================================================================
    // Firestore 路徑輔助
    // ================================================================
    const paths = {
      user: (uid) => db.collection('artifacts').doc(appId).collection('users').doc(uid),
      userTrips: (uid) => db.collection('artifacts').doc(appId).collection('users').doc(uid).collection('trips'),
      userTrip: (uid, tripId) => db.collection('artifacts').doc(appId).collection('users').doc(uid).collection('trips').doc(tripId),
      knownFamily: (uid) => db.collection('artifacts').doc(appId).collection('users').doc(uid).collection('known_family'),
      knownFamilyMember: (uid, memberUid) => db.collection('artifacts').doc(appId).collection('users').doc(uid).collection('known_family').doc(memberUid),
      sharedFamily: (code) => db.collection('artifacts').doc(appId).collection('shared_family').doc(code),
      sharedTrip: (tripId) => db.collection('artifacts').doc(appId).collection('shared_trips').doc(tripId),
      participant: (tripId, uid) => db.collection('artifacts').doc(appId).collection('shared_trips').doc(tripId).collection('participants').doc(uid),
    };

    // ================================================================
    // Phase 5:shared_trips 同步(從規劃者私有 trip → 公開快照)
    // ================================================================
    // 把 location 過濾成「家人能看到的版本」:
    //   - 祕密景點未揭曉 → 名稱替換為 alias,address/notes/phone/reservation 等私有欄位移除
    //   - 揭曉後與一般景點 → 完整公開
    function filterLocationForShared(loc) {
      const base = {
        id: loc.id,
        lat: loc.lat,
        lon: loc.lon,
        source: loc.source || 'osm',
        category: loc.category || 'custom',
        estimatedStayMinutes: loc.estimatedStayMinutes ?? null,
        priority: loc.priority || null,
        status: loc.status || 'pending',
        arrivedAt: loc.arrivedAt || null,
        leftAt: loc.leftAt || null,
        skippedAt: loc.skippedAt || null,
        isSurprise: !!loc.isSurprise,
        revealedAt: loc.revealedAt || null,
      };
      if (loc.isSurprise && !loc.revealedAt) {
        return {
          ...base,
          name: loc.surpriseAlias || '🎁 驚喜景點',
          // 不透露真實 originalName / address / opening_hours / phone / notes / reservation
        };
      }
      return {
        ...base,
        name: loc.name || '',
        originalName: loc.originalName || loc.name || '',
        address: loc.address || '',
        opening_hours: loc.opening_hours || '',
        phone: loc.phone || '',
        notes: loc.notes || '',
        reservation: loc.reservation || null,
      };
    }

    function buildSharedTripSnapshot(trip) {
      return {
        tripRef: trip.id,
        ownerUid: trip.ownerUid,
        title: trip.title || '',
        status: trip.status || 'draft',
        startDate: trip.startDate || '',
        departureTime: trip.departureTime || '09:00',
        // null = 全員參與;陣列 = 明確 UID 清單
        activeMembers: trip.activeMembers === undefined ? null : trip.activeMembers,
        origin: trip.origin || null,
        days: (trip.days || []).map((d) => ({
          dayNumber: d.dayNumber,
          date: d.date || '',
          departureTime: d.departureTime || null,
          origin: d.origin || null,
          locations: (d.locations || []).map(filterLocationForShared),
        })),
        notes: trip.notes || '',
        sharedAlbumUrl: trip.sharedAlbumUrl || '',
        sharedAlbumLabel: trip.sharedAlbumLabel || '',
        currentStatus: trip.currentStatus || { currentDayIndex: 0, currentLocationIndex: 0, status: 'pending' },
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
    }

    async function syncTripToShared(trip, shareCode) {
      if (!trip?.id || !shareCode || !db) return;
      try {
        const snapshot = buildSharedTripSnapshot(trip);
        await paths.sharedTrip(trip.id).set(snapshot);
        // 維護 activeTripId 指針:此 trip 是 active → 指向它;不是 → 若它原本是 active 就清掉
        if (trip.status === 'active') {
          await paths.sharedFamily(shareCode).update({ activeTripId: trip.id });
        } else {
          const famSnap = await paths.sharedFamily(shareCode).get();
          if (famSnap.exists && famSnap.data().activeTripId === trip.id) {
            await paths.sharedFamily(shareCode).update({ activeTripId: null });
          }
        }
      } catch (e) {
        console.warn('[Sync] syncTripToShared failed', e);
      }
    }

    async function deleteSharedTrip(tripId, shareCode) {
      if (!tripId || !db) return;
      try {
        await paths.sharedTrip(tripId).delete();
        if (shareCode) {
          const famSnap = await paths.sharedFamily(shareCode).get();
          if (famSnap.exists && famSnap.data().activeTripId === tripId) {
            await paths.sharedFamily(shareCode).update({ activeTripId: null });
          }
        }
      } catch (e) {
        console.warn('[Sync] deleteSharedTrip failed', e);
      }
    }

    // ================================================================
    // 工具函式
    // ================================================================
    function getUrlFamilyCode() {
      const params = new URLSearchParams(window.location.search);
      return params.get('family');
    }

    function generateFamilyShareCode(displayName) {
      const year = new Date().getFullYear();
      const clean = (displayName || 'USER').toUpperCase().replace(/[^A-Z0-9]/g, '');
      return `${clean.slice(0, 6) || 'USER'}${year}`;
    }

    async function ensureUniqueFamilyShareCode(baseCode, ownerUid) {
      let code = baseCode;
      for (let i = 0; i < 50; i++) {
        try {
          const snap = await paths.sharedFamily(code).get();
          if (!snap.exists) return code;
          if (snap.data().ownerUid === ownerUid) return code;
        } catch (e) {
          console.warn('[shareCode] uniqueness check failed', code, e);
          return code;
        }
        code = `${baseCode}-${i + 2}`;
      }
      return baseCode + '-' + Date.now().toString().slice(-4);
    }

    function parseRoute(hash) {
      const h = hash || window.location.hash || '#/';
      if (h.startsWith('#/family')) return { view: 'family_list' };
      const editMatch = h.match(/^#\/edit\/(.+)$/);
      if (editMatch) return { view: 'editor', tripId: editMatch[1] };
      const tripMatch = h.match(/^#\/trip\/(.+)$/);
      if (tripMatch) return { view: 'mobile_view', tripId: tripMatch[1] };
      if (h.startsWith('#/settings')) return { view: 'settings' };
      return { view: 'dashboard' };
    }

    function navigate(hash) {
      window.location.hash = hash;
    }

    function buildShareUrl(code) {
      const url = new URL(window.location.href);
      url.search = `?family=${encodeURIComponent(code)}`;
      url.hash = '';
      return url.toString();
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) { /* noop */ }
      document.body.removeChild(ta);
      return Promise.resolve();
    }

    function lsGet(key) {
      try { return localStorage.getItem(key); } catch (_) { return null; }
    }
    function lsSet(key, value) {
      try { localStorage.setItem(key, value); } catch (_) { /* noop */ }
    }

    function fmtRelativeTime(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : new Date(ts));
      const diff = Date.now() - d.getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1) return '剛剛';
      if (m < 60) return `${m} 分鐘前`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h} 小時前`;
      const days = Math.floor(h / 24);
      if (days < 30) return `${days} 天前`;
      return d.toLocaleDateString('zh-TW');
    }

    function generateLocationId() {
      return `loc_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }

    // ================================================================
    // POI 資料下載與快取(觀光署開放資料)
    // ================================================================
    function extractTwPOIItems(data) {
      if (!data) return [];
      if (Array.isArray(data)) return data;
      if (data.XML_Head?.Infos?.Info) return data.XML_Head.Infos.Info;
      if (data.XML_Head?.Infos) return data.XML_Head.Infos;
      if (data.Infos?.Info) return data.Infos.Info;
      if (data.Info) return data.Info;
      if (data.data) return data.data;
      return [];
    }
    function extractField(item, ...keys) {
      for (const k of keys) {
        const v = item[k];
        if (v !== undefined && v !== null && v !== '') return v;
      }
      return '';
    }
    async function fetchOneTwApi(api) {
      const tryFetch = async (url) => {
        const r = await fetch(url, { mode: 'cors' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      };
      let data;
      try {
        data = await tryFetch(api.url);
      } catch (e) {
        console.warn(`[POI] direct fetch failed for ${api.label}, trying CORS proxy`, e.message);
        data = await tryFetch(CORS_PROXY + encodeURIComponent(api.url));
      }
      const raw = extractTwPOIItems(data);
      const items = [];
      for (let i = 0; i < raw.length; i++) {
        const it = raw[i];
        const name = String(extractField(it, 'Name', 'ScenicSpotName', 'RestaurantName', 'HotelName', 'name') || '').trim();
        const lat = parseFloat(extractField(it, 'Py', 'PositionLat', 'lat', 'Latitude'));
        const lon = parseFloat(extractField(it, 'Px', 'PositionLon', 'lon', 'Longitude'));
        if (!name || !isFinite(lat) || !isFinite(lon) || lat === 0 || lon === 0) continue;
        items.push({
          id: `tw_${api.category}_${extractField(it, 'Id', 'ScenicSpotID', 'RestaurantID', 'HotelID') || i}`,
          name,
          address: String(extractField(it, 'Address', 'Add', 'address') || '').trim(),
          lat, lon,
          category: api.category,
          opening_hours: String(extractField(it, 'Opentime', 'OpenTime', 'opening_hours') || '').trim(),
        });
      }
      return items;
    }
    async function fetchAllTwPOIs(onProgress) {
      const all = [];
      for (let i = 0; i < POI_APIS.length; i++) {
        const api = POI_APIS[i];
        if (onProgress) onProgress({ phase: 'loading', current: i, total: POI_APIS.length, label: api.label });
        try {
          const items = await fetchOneTwApi(api);
          all.push(...items);
        } catch (e) {
          console.error(`[POI] failed to load ${api.label}`, e);
        }
      }
      if (onProgress) onProgress({ phase: 'done', count: all.length });
      return all;
    }
    async function loadTwPOIs({ forceRefresh = false, onProgress = null } = {}) {
      if (!forceRefresh) {
        try {
          const cached = lsGet(POI_CACHE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed.lastUpdate && (Date.now() - parsed.lastUpdate) < POI_CACHE_TTL_MS && Array.isArray(parsed.items) && parsed.items.length > 0) {
              if (onProgress) onProgress({ phase: 'cached', count: parsed.items.length });
              return parsed.items;
            }
          }
        } catch (e) {
          console.warn('[POI] cache parse failed', e);
        }
      }
      const items = await fetchAllTwPOIs(onProgress);
      try {
        lsSet(POI_CACHE_KEY, JSON.stringify({ lastUpdate: Date.now(), version: 1, items }));
      } catch (e) {
        console.warn('[POI] cache write failed (may exceed localStorage)', e);
      }
      return items;
    }

    // ================================================================
    // 四層 fallback 搜尋
    // ================================================================
    function searchLocalPOI(query, twPOIs) {
      if (!query || !twPOIs?.length) return [];
      const q = query.trim();
      // 1. 精確比對
      const exact = twPOIs.filter((p) => p.name === q);
      if (exact.length) return exact.slice(0, 20);
      // 2. 關鍵字比對(所有 token 都要出現於 name 或 address)
      const tokens = q.split(/\s+/).filter(Boolean);
      const contains = twPOIs.filter((p) =>
        tokens.every((t) => p.name.includes(t) || (p.address || '').includes(t))
      );
      if (contains.length) return contains.slice(0, 20);
      // 3. 模糊比對(嚴格):用 2-gram 覆蓋率,避免「拼湊式」假匹配
      // 3a. 明顯是地址的查詢 → 直接跳過,留給 OSM
      const looksLikeAddress = /[縣市區鄉鎮村里巷弄號段]/.test(q) && q.length >= 6;
      if (looksLikeAddress) return [];
      // 3b. 太短的 query 不做模糊(避免單字符就觸發一堆假匹配)
      if (q.length < 3) return [];
      // 3c. 拆成連續雙字(bigram),計算有幾個 bigram 也出現於 name + address
      //     例如「安平古堡」→ ["安平","平古","古堡"]
      //       真「安平古堡」3/3 = 100% ✓
      //       「劉安平古早味什錦麵」2/3 = 67%(< 80% 門檻 ✗)
      //       這樣不會把無關店家硬塞回來,真的找不到就 fallback 到 OSM。
      const bigrams = [];
      for (let i = 0; i < q.length - 1; i++) bigrams.push(q.slice(i, i + 2));
      const fuzzy = [];
      for (const p of twPOIs) {
        const text = (p.name || '') + ' ' + (p.address || '');
        let matchCount = 0;
        for (const bg of bigrams) if (text.includes(bg)) matchCount++;
        const ratio = matchCount / bigrams.length;
        if (ratio >= 0.8) fuzzy.push({ p, ratio });
      }
      fuzzy.sort((a, b) => b.ratio - a.ratio);
      return fuzzy.slice(0, 10).map((x) => x.p);
    }

    async function searchNominatim(query, { countryTw = true } = {}) {
      const params = new URLSearchParams({
        q: query,
        format: 'json',
        limit: '10',
        'accept-language': 'zh-TW',
      });
      if (countryTw) params.set('countrycodes', 'tw');
      const url = `https://nominatim.openstreetmap.org/search?${params}`;
      const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!resp.ok) throw new Error(`Nominatim HTTP ${resp.status}`);
      const data = await resp.json();
      return data.map((d) => ({
        id: `osm_${d.osm_type}_${d.osm_id}`,
        name: (d.display_name || '').split(',')[0],
        originalName: d.display_name,
        address: d.display_name,
        lat: parseFloat(d.lat),
        lon: parseFloat(d.lon),
        category: d.class || '',
        source: 'osm',
      }));
    }

    async function reverseGeocode(lat, lon) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=zh-TW`;
        const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!resp.ok) throw new Error(`Nominatim HTTP ${resp.status}`);
        const data = await resp.json();
        return {
          name: data.name || (data.display_name || '').split(',')[0] || `位置 ${lat.toFixed(4)},${lon.toFixed(4)}`,
          address: data.display_name || '',
        };
      } catch (e) {
        console.warn('[reverseGeocode] failed', e);
        return { name: `位置 ${lat.toFixed(4)},${lon.toFixed(4)}`, address: '' };
      }
    }

    function parseGoogleMapsUrl(url) {
      if (!url) return null;
      try {
        let lat = null, lon = null;

        // 優先 !3d!4d:這是 Google 對該地點的真實 marker 座標
        const dMatch = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
        if (dMatch) {
          lat = parseFloat(dMatch[1]);
          lon = parseFloat(dMatch[2]);
        }
        // 退而求其次:@lat,lon(地圖視圖中心,略有偏差)
        if (lat === null) {
          const atMatch = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
          if (atMatch) {
            lat = parseFloat(atMatch[1]);
            lon = parseFloat(atMatch[2]);
          }
        }
        // 最後嘗試 ?q=lat,lon
        if (lat === null) {
          try {
            const u = new URL(url);
            const q = u.searchParams.get('q');
            if (q) {
              const m = q.match(/^(-?\d+\.\d+),(-?\d+\.\d+)$/);
              if (m) { lat = parseFloat(m[1]); lon = parseFloat(m[2]); }
            }
          } catch (_) { /* not a valid URL with query */ }
        }

        if (lat === null || lon === null || Number.isNaN(lat) || Number.isNaN(lon)) return null;

        // 嘗試從 /place/{...}/ 抓地名:Google 會把店名或地址塞在這
        let name = '從 Google Maps 匯入';
        let address = '';
        const placeMatch = url.match(/\/place\/([^/@?#]+)/);
        if (placeMatch) {
          try {
            const decoded = decodeURIComponent(placeMatch[1]).replace(/\+/g, ' ').trim();
            if (decoded) {
              name = decoded;
              // 若內容看起來像台灣地址,也填到 address 欄
              if (/[市區路街巷弄號縣鄉鎮]/.test(decoded)) address = decoded;
            }
          } catch (_) { /* ignore decode failure */ }
        }

        return { lat, lon, name, address, source: 'gmaps_url' };
      } catch (_) { /* noop */ }
      return null;
    }

    function isGoogleMapsUrl(s) {
      if (!s) return false;
      // 支援 google.com / google.com.tw / google.co.uk 等多種 TLD,以及短網址
      return /google\.[a-z.]+\/maps|goo\.gl\/maps|maps\.app\.goo\.gl/.test(s);
    }

    // ================================================================
    // 距離 / OSRM 路徑 / 排程計算(Phase 3B)
    // ================================================================
    const OSRM_BASE = 'https://router.project-osrm.org/route/v1/driving/';

    function haversineKm(lat1, lon1, lat2, lon2) {
      if (!isFinite(lat1) || !isFinite(lon1) || !isFinite(lat2) || !isFinite(lon2)) return 0;
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    const _routeCache = new Map(); // "lat1,lon1|lat2,lon2" → { distance(m), duration(s), fallback?, geometry? }
    async function fetchOSRMSegment(a, b) {
      if (!a || !b || !isFinite(a.lat) || !isFinite(b.lat)) {
        return { distance: 0, duration: 0, fallback: true, geometry: null };
      }
      const key = `${a.lat.toFixed(5)},${a.lon.toFixed(5)}|${b.lat.toFixed(5)},${b.lon.toFixed(5)}`;
      if (_routeCache.has(key)) return _routeCache.get(key);
      try {
        // overview=simplified:取簡化過的多點座標,夠平滑又省頻寬
        const url = `${OSRM_BASE}${a.lon},${a.lat};${b.lon},${b.lat}?overview=simplified&geometries=geojson`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`OSRM HTTP ${resp.status}`);
        const data = await resp.json();
        if (!data.routes?.length) throw new Error('OSRM no route');
        const route = data.routes[0];
        // GeoJSON 是 [lon, lat],Leaflet 要 [lat, lon],這裡轉一下
        const geometry = route.geometry?.coordinates?.map(([lon, lat]) => [lat, lon]) || null;
        const r = { distance: route.distance, duration: route.duration, geometry };
        _routeCache.set(key, r);
        return r;
      } catch (e) {
        console.warn('[OSRM] fallback to haversine', e.message);
        const km = haversineKm(a.lat, a.lon, b.lat, b.lon);
        // 估算:平均 46 km/h(混合市區與省道)、道路長度 = 直線 × 1.3
        const r = { distance: km * 1300, duration: (km * 1.3 / 46) * 3600, fallback: true, geometry: null };
        _routeCache.set(key, r);
        return r;
      }
    }

    // ================================================================
    // Overpass API:查詢一個座標附近的 POI(沿途推薦用)
    // ================================================================
    const OVERPASS_BASE = 'https://overpass-api.de/api/interpreter';
    const _overpassCache = new Map(); // "lat,lon|radius" → { attraction, restaurant, toilets, fuel }

    async function fetchNearbyPOIs(lat, lon, radiusM = 3000) {
      if (!isFinite(lat) || !isFinite(lon)) return { attraction: [], restaurant: [], toilets: [], fuel: [] };
      const key = `${lat.toFixed(3)},${lon.toFixed(3)}|${radiusM}`;
      if (_overpassCache.has(key)) return _overpassCache.get(key);

      const q = `[out:json][timeout:15];(node["tourism"="attraction"](around:${radiusM},${lat},${lon});node["amenity"="restaurant"](around:${radiusM},${lat},${lon});node["amenity"="toilets"](around:${radiusM},${lat},${lon});node["amenity"="fuel"](around:${radiusM},${lat},${lon}););out body 80;`;
      try {
        const resp = await fetch(OVERPASS_BASE, { method: 'POST', body: q, headers: { 'Content-Type': 'text/plain' } });
        if (!resp.ok) throw new Error(`Overpass HTTP ${resp.status}`);
        const data = await resp.json();
        const grouped = { attraction: [], restaurant: [], toilets: [], fuel: [] };
        const defaultName = { attraction: '景點', restaurant: '餐廳', toilets: '公廁', fuel: '加油站' };
        (data.elements || []).forEach((el) => {
          let cat = null;
          if (el.tags?.tourism === 'attraction') cat = 'attraction';
          else if (el.tags?.amenity === 'restaurant') cat = 'restaurant';
          else if (el.tags?.amenity === 'toilets') cat = 'toilets';
          else if (el.tags?.amenity === 'fuel') cat = 'fuel';
          if (!cat) return;
          if (!isFinite(el.lat) || !isFinite(el.lon)) return;
          const name = el.tags?.name || el.tags?.['name:zh'] || el.tags?.['name:zh-Hant'] || defaultName[cat];
          grouped[cat].push({
            id: 'osm_' + el.id,
            name,
            lat: el.lat,
            lon: el.lon,
            distanceKm: haversineKm(lat, lon, el.lat, el.lon),
            tags: el.tags || {},
          });
        });
        // 每類依距離排序
        Object.keys(grouped).forEach((k) => grouped[k].sort((a, b) => a.distanceKm - b.distanceKm));
        _overpassCache.set(key, grouped);
        return grouped;
      } catch (e) {
        console.warn('[Overpass] fetch failed', e);
        return { attraction: [], restaurant: [], toilets: [], fuel: [] };
      }
    }

    function parseTimeHHMM(s) {
      if (!s) return null;
      const m = String(s).match(/^(\d{1,2}):(\d{2})$/);
      if (!m) return null;
      return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    }

    function formatMinutes(m) {
      if (m === null || m === undefined || !isFinite(m)) return '';
      let v = Math.round(m);
      const days = Math.floor(v / (24 * 60));
      v = ((v % (24 * 60)) + 24 * 60) % (24 * 60);
      const h = Math.floor(v / 60);
      const min = v % 60;
      const t = `${h.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}`;
      return days > 0 ? `+${days}d ${t}` : t;
    }

    async function computeDaySchedule(departureTime, locations, origin = null) {
      if (!locations?.length) return [];
      const result = [];
      let currentMin = parseTimeHHMM(departureTime) ?? 9 * 60;

      // 預先平行抓所有相鄰段路徑(更快)
      // 有 origin 時:segments[0] = origin→loc[0],segments[i] = loc[i-1]→loc[i] for i≥1
      // 沒 origin:segments[i-1] = loc[i-1]→loc[i] for i≥1(同舊邏輯)
      const segPromises = [];
      if (origin && origin.lat != null && origin.lon != null) {
        segPromises.push(fetchOSRMSegment(origin, locations[0]));
      }
      for (let i = 1; i < locations.length; i++) {
        segPromises.push(fetchOSRMSegment(locations[i - 1], locations[i]));
      }
      const segments = await Promise.all(segPromises);
      const hasOrigin = !!(origin && origin.lat != null && origin.lon != null);

      for (let i = 0; i < locations.length; i++) {
        const loc = locations[i];
        let travelMin = 0;
        let distanceKm = 0;
        let routeFallback = false;
        let detourRatio = null;

        // 取入站段:有 origin 時 segments[i] 就是入站段;沒 origin 時 i==0 沒入站段、i>0 用 segments[i-1]
        const segIdx = hasOrigin ? i : i - 1;
        const inboundSeg = segIdx >= 0 ? segments[segIdx] : null;

        if (inboundSeg) {
          travelMin = Math.round(inboundSeg.duration / 60);
          distanceKm = inboundSeg.distance / 1000;
          routeFallback = !!inboundSeg.fallback;
          currentMin += travelMin;
        }

        // 繞路檢查(中間站):看 (前一站, 此站, 下一站) 是否明顯繞路
        // 第 0 站若有 origin,也可檢查 (origin, loc[0], loc[1])
        const prev = i > 0 ? locations[i - 1] : (hasOrigin && i === 0 ? origin : null);
        const next = i + 1 < locations.length ? locations[i + 1] : null;
        if (prev && next) {
          const direct = haversineKm(prev.lat, prev.lon, next.lat, next.lon);
          const via = haversineKm(prev.lat, prev.lon, loc.lat, loc.lon) + haversineKm(loc.lat, loc.lon, next.lat, next.lon);
          if (direct > 0.5) detourRatio = via / direct;
        }

        const arrivalMin = currentMin;
        const stayMin = loc.estimatedStayMinutes ?? DEFAULT_STAY_BY_CATEGORY[loc.category] ?? 60;
        const departureMin = arrivalMin + stayMin;

        // 警示
        const warnings = [];
        if (detourRatio !== null && detourRatio > 1.5) {
          warnings.push({ type: 'detour', ratio: detourRatio });
        }
        if (loc.reservation?.time) {
          const rMin = parseTimeHHMM(loc.reservation.time);
          if (rMin !== null) {
            const diff = arrivalMin - rMin;
            if (diff > 0) warnings.push({ type: 'late', minutes: diff });
            else if (diff < -30) warnings.push({ type: 'early', minutes: -diff });
          }
        }

        result.push({
          locationId: loc.id,
          arrivalMin, departureMin,
          arrivalTime: formatMinutes(arrivalMin),
          departureTime: formatMinutes(departureMin),
          stayMin,
          travelMin, distanceKm, routeFallback,
          geometry: inboundSeg?.geometry || null, // 沿路 [lat, lon] 陣列,給地圖畫線用
          detourRatio,
          warnings,
        });
        currentMin = departureMin;
      }
      return result;
    }

    // 取「該天的出發時間」:優先用 day 自己的,沒設就回退到 trip 預設,再不行用 09:00
    function getDayDepartureTime(day, trip) {
      return day?.departureTime || trip?.departureTime || '09:00';
    }

    // 取「該天的出發地點」:
    //   Day 1     → trip.origin(使用者在 行程設定 設的)
    //   Day N>1   → 前一天最後一站(通常是 hotel);若前一天沒站點則 fallback 用 trip.origin
    //   各 Day 可用 day.origin 個別覆蓋(MVP 未提供 UI,僅資料層支援)
    function getDayOrigin(dayIndex, days, trip) {
      const day = days[dayIndex];
      if (day?.origin?.lat != null) return day.origin;
      if (dayIndex > 0) {
        const prev = days[dayIndex - 1];
        const last = prev?.locations?.[prev.locations.length - 1];
        if (last && last.lat != null) {
          return {
            name: last.name,
            lat: last.lat,
            lon: last.lon,
            address: last.address || '',
            source: 'inherit', // 表示「繼承自前一天最後一站」
          };
        }
      }
      return trip?.origin || null;
    }

    function computeTightness(schedule) {
      if (!schedule?.length) return null;
      const endMin = schedule[schedule.length - 1].departureMin;
      const lastLoc = schedule[schedule.length - 1];
      // 結束時刻 = 最後一站離開時間;若停留 0(過夜)則用抵達時間
      const checkMin = lastLoc.stayMin > 0 ? endMin : lastLoc.arrivalMin;
      if (checkMin < 17 * 60) return { level: 'loose', label: '🟢 充裕', cssBg: 'bg-emerald-50', cssText: 'text-emerald-700', cssBorder: 'border-emerald-200' };
      if (checkMin < 19 * 60) return { level: 'tight', label: '🟡 緊湊', cssBg: 'bg-yellow-50', cssText: 'text-yellow-700', cssBorder: 'border-yellow-300' };
      if (checkMin < 21 * 60) return { level: 'over', label: '🟠 過滿', cssBg: 'bg-orange-50', cssText: 'text-orange-700', cssBorder: 'border-orange-300' };
      return { level: 'impossible', label: '🔴 不可行', cssBg: 'bg-red-50', cssText: 'text-red-700', cssBorder: 'border-red-300' };
    }

    // ================================================================
    // Phase 7.2:PDF 匯出(用瀏覽器列印 → 儲存為 PDF)
    // ================================================================
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    async function exportTripAsPdf(trip, profile) {
      if (!trip) return;
      const days = trip.days || [];
      // 預先算每天的排程(取得各站抵達/離開時間)
      let schedules;
      try {
        schedules = await Promise.all(days.map((d, i) => {
          const origin = getDayOrigin(i, days, trip);
          const dep = getDayDepartureTime(d, trip);
          return computeDaySchedule(dep, d.locations || [], origin);
        }));
      } catch (e) {
        console.warn('[PDF] schedule compute failed, fallback', e);
        schedules = days.map(() => []);
      }

      const shareUrl = profile?.familyShareCode ? buildShareUrl(profile.familyShareCode) : '';
      const html = buildPrintableHtml(trip, profile, days, schedules, shareUrl);

      const w = window.open('', '_blank');
      if (!w) {
        alert('瀏覽器阻擋彈出視窗。請允許彈出後再試,或改用 Ctrl/Cmd + P 列印。');
        return;
      }
      w.document.open();
      w.document.write(html);
      w.document.close();
      // 等資源(QR、字型)就緒後自動跳列印對話框
      const tryPrint = () => { try { w.focus(); w.print(); } catch (_) {} };
      if (w.document.readyState === 'complete') {
        setTimeout(tryPrint, 600);
      } else {
        w.addEventListener('load', () => setTimeout(tryPrint, 600));
      }
    }

    function buildPrintableHtml(trip, profile, days, schedules, shareUrl) {

    }

    // ================================================================
    // Phase 7.4:中央氣象署 36 小時天氣預報(F-C0032-001)
    // 申請 API key:https://opendata.cwa.gov.tw
    // 註:F-C0032-001 實際只涵蓋未來 ~36 小時(三個時段),所以只在「明後天」內查
    // ================================================================
    const TW_COUNTY_REGEX = /(臺北市|台北市|新北市|桃園市|臺中市|台中市|臺南市|台南市|高雄市|基隆市|新竹縣|新竹市|苗栗縣|彰化縣|南投縣|雲林縣|嘉義縣|嘉義市|屏東縣|宜蘭縣|花蓮縣|臺東縣|台東縣|澎湖縣|金門縣|連江縣)/;
    function parseCountyFromAddress(addr) {
      if (!addr) return null;
      const m = addr.match(TW_COUNTY_REGEX);
      if (!m) return null;
      // CWA API 使用「臺」字
      return m[1].replace(/^台/, '臺');
    }

    // 暴露給 console 方便除錯
    if (typeof window !== 'undefined') {
      window._debug = window._debug || {};
      window._debug.parseCountyFromAddress = parseCountyFromAddress;
    }

    function wxEmoji(wx) {
      if (!wx) return '🌡️';
      if (wx.includes('雷')) return '⛈️';
      if (wx.includes('雪')) return '❄️';
      if (wx.includes('雨')) return '🌧️';
      if (wx.includes('陰')) return '☁️';
      if (wx.includes('多雲')) return '⛅';
      if (wx.includes('晴')) return '☀️';
      return '🌡️';
    }

    const _cwaCache = new Map(); // "county|date" → weather obj
    async function fetchCwaWeather(county, dateStr) {
      if (!window.cwaApiKey || !county || !dateStr) return null;
      const cacheKey = `${county}|${dateStr}`;
      if (_cwaCache.has(cacheKey)) return _cwaCache.get(cacheKey);
      try {
        const url = `https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=${encodeURIComponent(window.cwaApiKey)}&locationName=${encodeURIComponent(county)}&format=JSON`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`CWA HTTP ${resp.status}`);
        const data = await resp.json();
        const loc = data.records?.location?.[0];
        if (!loc) return null;
        const elements = {};
        (loc.weatherElement || []).forEach((e) => { elements[e.elementName] = e.time; });
        // 找包含 dateStr 中午的時段
        const target = new Date(dateStr + 'T12:00:00').getTime();
        const wxTimes = elements.Wx || [];
        const period = wxTimes.find((t) => {
          const s = new Date(t.startTime).getTime();
          const e = new Date(t.endTime).getTime();
          return s <= target && target <= e;
        });
        if (!period) return null;
        const valueFor = (name) => {
          const t = (elements[name] || []).find((x) => x.startTime === period.startTime);
          return t?.parameter?.parameterName || null;
        };
        const result = {
          wx: valueFor('Wx'),
          pop: valueFor('PoP'),
          minT: valueFor('MinT'),
          maxT: valueFor('MaxT'),
          ci: valueFor('CI'),
          county,
        };
        _cwaCache.set(cacheKey, result);
        return result;
      } catch (e) {
        console.warn('[CWA] fetch failed', e);
        return null;
      }
    }

    if (typeof window !== 'undefined') {
      window._debug = window._debug || {};
      window._debug.fetchCwaWeather = fetchCwaWeather;
    }

    function WeatherChip({ county, dateStr, compact = false }) {
      const [weather, setWeather] = useState(null);
      useEffect(() => {
        if (!window.cwaApiKey || !county || !dateStr) return;
        const d = new Date(dateStr + 'T00:00:00');
        const daysAhead = (d - new Date()) / (1000 * 60 * 60 * 24);
        if (daysAhead < -1 || daysAhead > 2) return; // F-C0032-001 只涵蓋未來 ~36 小時
        let cancelled = false;
        fetchCwaWeather(county, dateStr).then((w) => { if (!cancelled) setWeather(w); });
        return () => { cancelled = true; };
      }, [county, dateStr]);
      if (!weather) return null;
      return (
        <div className={`flex items-center gap-1 ${compact ? 'text-xs' : 'text-sm'} text-slate-600`}>
          <span>{wxEmoji(weather.wx)}</span>
          <span>{weather.county} {weather.minT}–{weather.maxT}°C</span>
          {weather.pop && <span className="text-blue-600">· 降雨 {weather.pop}%</span>}
          <span className="text-slate-400 truncate">· {weather.wx}</span>
        </div>
      );
    }

    // ================================================================

        window.addEventListener('installCompleted', onInstalled);

          window.removeEventListener('installCompleted', onInstalled);
          window.removeEventListener('swUpdateAvailable', onUpdate);

      }, []);

      const handleInstall = async () => {

    // ================================================================
    // Phase 6:預下載地圖(算 tile URL → 透過 SW message 寫入 Cache)
    // ================================================================
    function getTripBounds(trip) {
      let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
      const pushPt = (lat, lon) => {
        if (!isFinite(lat) || !isFinite(lon)) return;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
      };
      if (trip?.origin) pushPt(trip.origin.lat, trip.origin.lon);
      (trip?.days || []).forEach((d) => {
        if (d.origin) pushPt(d.origin.lat, d.origin.lon);
        (d.locations || []).forEach((l) => pushPt(l.lat, l.lon));
      });
      if (minLat === Infinity) return null;
      // 加 buffer ~ 0.05 度(~5km)
      return {
        minLat: minLat - 0.05,
        maxLat: maxLat + 0.05,
        minLon: minLon - 0.05,
        maxLon: maxLon + 0.05,
      };
    }

    function tilesForBounds(b, zoom) {
      const n = Math.pow(2, zoom);
      const lonToX = (lon) => Math.floor((lon + 180) / 360 * n);
      const latToY = (lat) => {
        const r = lat * Math.PI / 180;
        return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n);
      };
      const xMin = Math.max(0, lonToX(b.minLon));
      const xMax = Math.min(n - 1, lonToX(b.maxLon));
      const yMin = Math.max(0, latToY(b.maxLat));
      const yMax = Math.min(n - 1, latToY(b.minLat));
      const urls = [];
      const subs = ['a', 'b', 'c'];
      let i = 0;
      for (let x = xMin; x <= xMax; x++) {
        for (let y = yMin; y <= yMax; y++) {
          const s = subs[i++ % 3];
          urls.push(`https://${s}.tile.openstreetmap.org/${zoom}/${x}/${y}.png`);
        }
      }
      return urls;
    }

    function postToSW(message) {
      return new Promise((resolve, reject) => {
        const sw = navigator.serviceWorker?.controller;
        if (!sw) { reject(new Error('Service Worker 尚未啟用,請先重新整理一次頁面')); return; }
        const ch = new MessageChannel();
        const t = setTimeout(() => reject(new Error('SW 沒回應')), 120000);
        ch.port1.onmessage = (e) => { clearTimeout(t); resolve(e.data); };
        sw.postMessage(message, [ch.port2]);
      });
    }

    function PrecacheMapModal({ trip, onClose }) {
      const bounds = useMemo(() => getTripBounds(trip), [trip]);
      const ZOOMS = [11, 12, 13, 14, 15];
      const tileBatches = useMemo(() => {
        if (!bounds) return [];
        return ZOOMS.map((z) => ({ zoom: z, urls: tilesForBounds(bounds, z) }));
      }, [bounds]);
      const totalTiles = tileBatches.reduce((s, b) => s + b.urls.length, 0);
      const [busy, setBusy] = useState(false);
      const [progress, setProgress] = useState({ done: 0, ok: 0, fail: 0 });
      const [finished, setFinished] = useState(false);

      const handleStart = async () => {
        setBusy(true);
        setProgress({ done: 0, ok: 0, fail: 0 });
        let okTotal = 0, failTotal = 0, doneTotal = 0;
        for (const batch of tileBatches) {
          try {
            const r = await postToSW({ type: 'CACHE_TILES', urls: batch.urls });
            okTotal += r.ok || 0;
            failTotal += r.fail || 0;
            doneTotal += batch.urls.length;
            setProgress({ done: doneTotal, ok: okTotal, fail: failTotal });
          } catch (e) {
            alert('預下載失敗:' + (e.message || e));
            setBusy(false);
            return;
          }
        }
        setFinished(true);
        setBusy(false);
      };

      const handleClear = async () => {
        if (!window.confirm('清除已快取的所有地圖圖磚?')) return;
        try {
          await postToSW({ type: 'CLEAR_TILES' });
          alert('已清除地圖快取');
          setFinished(false);
          setProgress({ done: 0, ok: 0, fail: 0 });
        } catch (e) {
          alert('清除失敗:' + (e.message || e));
        }
      };

      const tileSizeKB = 18; // 估計每張 ~18KB
      const estimateMB = Math.round(totalTiles * tileSizeKB / 1024);

      return (
        <div className="fixed inset-0 bg-black/40 z-[2000] flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl max-w-md w-full p-5 space-y-3" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <h3 className="text-lg font-bold text-slate-800">📥 預下載地圖</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl">×</button>
            </div>

            {!bounds ? (
              <p className="text-sm text-slate-600">行程尚未加入任何地點,無法計算範圍。請先在 Editor 加入景點。</p>
            ) : (
              <>
                <div className="bg-slate-50 rounded-lg p-3 text-sm space-y-1">
                  <div className="flex justify-between"><span className="text-slate-600">行程</span><span className="font-medium">{trip.title}</span></div>
                  <div className="flex justify-between"><span className="text-slate-600">縮放層級</span><span>{ZOOMS.join(', ')}</span></div>
                  <div className="flex justify-between"><span className="text-slate-600">圖磚總數</span><span>{totalTiles.toLocaleString()} 張</span></div>
                  <div className="flex justify-between"><span className="text-slate-600">預估容量</span><span>≈ {estimateMB} MB</span></div>
                </div>
                {busy && (
                  <div className="space-y-1">
                    <div className="w-full h-2 bg-slate-200 rounded">
                      <div className="h-2 bg-blue-500 rounded transition-all" style={{ width: `${Math.round((progress.done / totalTiles) * 100)}%` }}></div>
                    </div>
                    <p className="text-xs text-slate-600 text-center">
                      {progress.done} / {totalTiles}(成功 {progress.ok},失敗 {progress.fail})
                    </p>
                  </div>
                )}
                {finished && !busy && (
                  <div className="bg-emerald-50 border border-emerald-200 rounded p-2 text-sm text-emerald-800">
                    ✓ 預下載完成:{progress.ok} 張快取成功{progress.fail > 0 && `,${progress.fail} 張失敗(可重試)`}
                  </div>
                )}
                <div className="bg-amber-50 border border-amber-200 rounded p-2 text-xs text-amber-800">
                  ⚠️ 大量請求會被 OSM 限流,如果失敗多請間隔重試。山區記得行前下載,因為現場可能沒網路。
                </div>

    // ================================================================
    // 行程卡片(Dashboard 中使用)
    // ================================================================
    // 複製 trip:清掉進行中狀態、費用、揭曉,複製給同位 owner
    async function duplicateTrip(originalTrip, ownerUid) {
      const cleanLocations = (locs) => (locs || []).map((l) => {
        const clean = { ...l };
        clean.id = generateLocationId();
        delete clean.status;
        delete clean.arrivedAt;
        delete clean.leftAt;
        delete clean.skippedAt;
        delete clean.revealedAt; // 祕密景點重置為未揭曉
        return clean;
      });
      const data = {
        title: `(複製) ${originalTrip.title || '未命名行程'}`,
        ownerUid,
        status: 'draft',
        startDate: '', // 清空日期讓使用者重新設
        departureTime: originalTrip.departureTime || '09:00',
        notes: originalTrip.notes || '',
        origin: originalTrip.origin || null,
        activeMembers: originalTrip.activeMembers || null,
        days: (originalTrip.days || [{ dayNumber: 1, locations: [] }]).map((d, i) => ({
          dayNumber: i + 1,
          date: '',
          departureTime: d.departureTime || null,
          origin: d.origin || null,
          locations: cleanLocations(d.locations),
        })),
        expenses: [], // 費用不複製
        sharedAlbumUrl: '', // 相簿連結不複製(新旅程新相簿)
        sharedAlbumLabel: '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      const ref = await paths.userTrips(ownerUid).add(data);
      return ref.id;
    }

        if (!window.confirm(`複製「${trip.title}」?\n\n會建立一份新草稿,清掉進行狀態、費用與祕密揭曉。`)) return;
        setDuplicating(true);
        try {
          const newId = await duplicateTrip(trip, user.uid);

          await paths.knownFamilyMember(user.uid, member.id).update({ color });
        } catch (e) {
          alert('儲存失敗:' + (e.message || e));
        } finally { setBusy(false); }

        setBusy(true);
        try {

    // ================================================================
    // 設定頁
    // ================================================================
    function HomeSetupBox({ user, profile }) {
      const home = profile?.home;
      const [busy, setBusy] = useState(false);
      const [urlInput, setUrlInput] = useState('');
      const [nameInput, setNameInput] = useState(home?.name || '住家');
      const [msg, setMsg] = useState('');

      const saveHome = async (next) => {
        setBusy(true);
        setMsg('');
        try {
          await paths.user(user.uid).update({
            home: next,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
          setMsg('✓ 已儲存');
          setTimeout(() => setMsg(''), 1500);
        } catch (e) {
          console.error('[Home] save failed', e);
          setMsg('⚠️ 儲存失敗:' + (e.message || e));
        } finally {
          setBusy(false);
        }
      };

      const handleUseCurrent = () => {
        if (!navigator.geolocation) { setMsg('此瀏覽器不支援定位'); return; }
        setBusy(true);
        setMsg('正在抓取目前位置...');
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const { latitude: lat, longitude: lon } = pos.coords;
            let name = nameInput || '住家';
            let address = '';
            try {
              const geo = await reverseGeocode(lat, lon);
              if (geo?.address) address = geo.address;
              if (!nameInput && geo?.name) name = geo.name;
            } catch (_) { /* ignore */ }
            await saveHome({ name, lat, lon, address });
          },
          (err) => {
            setBusy(false);
            setMsg('⚠️ 取得位置失敗:' + err.message);
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
      };

      const handleUseUrl = async () => {
        const trimmed = urlInput.trim();
        if (!trimmed) { setMsg('請先貼上 Google Maps 連結'); return; }
        if (!isGoogleMapsUrl(trimmed)) {
          setMsg('⚠️ 看起來不像 Google Maps 連結');
          return;
        }
        const parsed = parseGoogleMapsUrl(trimmed);
        if (!parsed || !parsed.lat || !parsed.lon) {
          setMsg('⚠️ 無法從這個連結解析座標,請改用含 @lat,lon 的完整網址');
          return;
        }
        const name = nameInput || parsed.name || '住家';
        await saveHome({ name, lat: parsed.lat, lon: parsed.lon, address: parsed.address || '' });
        setUrlInput('');
      };

      const handleClear = async () => {
        if (!window.confirm('清除已設定的住家?')) return;
        await saveHome(firebase.firestore.FieldValue.delete());
      };

      const handleRenameOnly = async () => {
        if (!home?.lat) { setMsg('尚未設定住家'); return; }
        if (!nameInput.trim()) { setMsg('名稱不可空白'); return; }
        await saveHome({ ...home, name: nameInput.trim() });

    function ResetShareCodeBox({ user, profile }) {
      const [expanded, setExpanded] = useState(false);
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState('');

      const handleReset = async () => {
        if (!window.confirm('重設家庭分享碼?\n\n舊連結立刻失效。家人需要拿新連結重新加入(等同重新註冊)。\n\n此動作無法復原。')) return;
        if (!window.confirm('再次確認:重設後您要重新傳新連結給每位想保留的家人。確定?')) return;

        setBusy(true);
        setMsg('產生新分享碼...');
        try {
          const oldCode = profile.familyShareCode;
          const displayName = profile?.nickname || user?.displayName || 'User';
          // 產生新碼:基底 + 4 位亂數,確保不撞已有 shared_family
          let newCode;
          for (let i = 0; i < 50; i++) {
            const candidate = generateFamilyShareCode(displayName) + Math.floor(Math.random() * 9000 + 1000);
            const snap = await paths.sharedFamily(candidate).get();
            if (!snap.exists) { newCode = candidate; break; }
          }
          if (!newCode) throw new Error('產生新分享碼失敗,請稍後再試');

          // 1. 建立新 shared_family 入口
          await paths.sharedFamily(newCode).set({
            ownerUid: user.uid,
            ownerName: displayName,
            activeTripId: null,
            recentTrips: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });

          // 2. 更新 profile
          await paths.user(user.uid).update({ familyShareCode: newCode });

          // 3. 刪除舊 shared_family
          if (oldCode) {
            try { await paths.sharedFamily(oldCode).delete(); } catch (e) { console.warn('[Reset] delete old shareCode failed', e); }
          }

          setMsg(`✓ 已重設為「${newCode}」,新連結已寫入您的個人資料。請把新連結傳給家人。`);
        } catch (e) {
          setMsg('重設失敗:' + (e.message || e));
        } finally {
          setBusy(false);
        }
      };

      return (
        <div className="bg-white rounded-xl border border-slate-200">
          <button
            onClick={() => setExpanded((v) => !v)}
            className="w-full px-4 py-3 flex items-center justify-between hover:bg-slate-50 rounded-xl"
          >
            <span className="text-sm font-semibold text-slate-700">🔁 重設家庭分享碼</span>
            <span className="text-slate-400">{expanded ? '▲' : '▼'}</span>
          </button>
          {expanded && (
            <div className="px-4 pb-4 pt-1 border-t border-slate-100 space-y-2 text-sm">
              <div className="bg-red-50 border border-red-200 rounded p-2 text-red-700 text-xs space-y-1">
                <p>⚠️ <span className="font-semibold">只在必要時使用</span>(如:朋友撕破臉、孩子玩太兇、想換新成員)。</p>
                <p>重設後:</p>
                <ul className="list-disc list-inside pl-2 space-y-0.5">
                  <li>舊分享連結立刻失效</li>
                  <li>所有家人 PWA 圖示開啟會顯示「找不到分享碼」</li>
                  <li>您要把新連結重新傳給每位想保留的家人</li>
                  <li>家人需要重新設定稱呼/圖示(localStorage 跟著新碼)</li>

              </div>
              <button

              {msg && <p className="text-xs text-slate-600 break-words">{msg}</p>}
            </div>
          )}

      );

    function DebouncedInput({ value, onChange, debounceMs = 500, className = '', ...rest }) {
      const [local, setLocal] = useState(value || '');
      const timerRef = useRef(null);
      const lastValueRef = useRef(value);
      useEffect(() => {
        if (value !== lastValueRef.current) {
          lastValueRef.current = value;
          setLocal(value || '');
        }
      }, [value]);
      const handleChange = (e) => {
        const v = e.target.value;
        setLocal(v);
        lastValueRef.current = v;
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => onChange(v), debounceMs);
      };
      const handleBlur = () => {
        if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
        if (local !== value) onChange(local);
      };
      return <input value={local} onChange={handleChange} onBlur={handleBlur} className={className} {...rest} />;
    }

    function DebouncedTextarea({ value, onChange, debounceMs = 600, className = '', ...rest }) {
      const [local, setLocal] = useState(value || '');
      const timerRef = useRef(null);
      const lastValueRef = useRef(value);
      useEffect(() => {
        if (value !== lastValueRef.current) {
          lastValueRef.current = value;
          setLocal(value || '');
        }
      }, [value]);
      const handleChange = (e) => {
        const v = e.target.value;
        setLocal(v);
        lastValueRef.current = v;
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => onChange(v), debounceMs);
      };
      const handleBlur = () => {
        if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
        if (local !== value) onChange(local);
      };
      return <textarea value={local} onChange={handleChange} onBlur={handleBlur} className={className} {...rest} />;
    }

    function TripOriginPicker({ origin, profile, onUpdate }) {
      const [urlInput, setUrlInput] = useState('');
      const [msg, setMsg] = useState('');

      const setOriginFromHome = () => {
        if (!profile?.home?.lat || !profile?.home?.lon) {
          setMsg('尚未設定住家。請到 ⚙️ 設定 頁面先設好住家。');
          return;
        }
        onUpdate({
          origin: {
            name: profile.home.name || '住家',
            lat: profile.home.lat,
            lon: profile.home.lon,
            address: profile.home.address || '',
            source: 'home',
          },
        });
        setMsg('✓ 已設為住家');
        setTimeout(() => setMsg(''), 1500);
      };

      const setOriginFromCurrent = () => {
        if (!navigator.geolocation) { setMsg('此瀏覽器不支援定位'); return; }
        setMsg('正在取得目前位置...');
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const { latitude: lat, longitude: lon } = pos.coords;
            let name = '目前位置';
            let address = '';
            try {
              const geo = await reverseGeocode(lat, lon);
              if (geo?.name) name = geo.name;
              if (geo?.address) address = geo.address;
            } catch (_) { /* ignore */ }
            onUpdate({ origin: { name, lat, lon, address, source: 'current' } });
            setMsg('✓ 已設為目前位置');
            setTimeout(() => setMsg(''), 1500);
          },
          (err) => setMsg('⚠️ 取得位置失敗:' + err.message),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
      };

      const setOriginFromUrl = () => {
        const trimmed = urlInput.trim();
        if (!trimmed) { setMsg('請先貼上 Google Maps 連結'); return; }
        if (!isGoogleMapsUrl(trimmed)) { setMsg('⚠️ 看起來不像 Google Maps 連結'); return; }
        const parsed = parseGoogleMapsUrl(trimmed);
        if (!parsed) { setMsg('⚠️ 無法從連結解析座標'); return; }
        onUpdate({
          origin: {
            name: parsed.name || '自訂出發地點',
            lat: parsed.lat,
            lon: parsed.lon,
            address: parsed.address || '',
            source: 'custom',
          },
        });
        setUrlInput('');
        setMsg('✓ 已設為自訂地點');
        setTimeout(() => setMsg(''), 1500);
      };

      const clearOrigin = () => {
        if (!window.confirm('清除出發地點?Day 1 將不會計算「從起點開到第 1 站」的路程。')) return;
        onUpdate({ origin: firebase.firestore.FieldValue.delete() });
      };

      return (
        <div className="border border-slate-200 rounded-lg p-3 space-y-2 bg-slate-50">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <span className="text-xs font-semibold text-slate-600">📍 出發地點(Day 1 從哪裡開始)</span>
            {origin && (
              <button onClick={clearOrigin} className="text-xs text-red-500 hover:text-red-700 underline">
                🗑️ 清除
              </button>
            )}
          </div>

          {origin ? (
            <div className="bg-white border border-emerald-200 rounded p-2 text-sm">
              <div className="font-medium text-slate-800">
                {origin.source === 'home' && '🏠 '}
                {origin.source === 'current' && '📍 '}
                {origin.source === 'custom' && '📌 '}
                {origin.name}
              </div>
              {origin.address && <div className="text-xs text-slate-500">{origin.address}</div>}
              <div className="text-[10px] text-slate-400 font-mono">{origin.lat?.toFixed(5)}, {origin.lon?.toFixed(5)}</div>
            </div>
          ) : (
            <div className="text-xs text-slate-500">
              尚未設定。沒設的話,Day 1 第 1 站的抵達時間 = 出發時間(等於 0 開車時間)。
              <br />Day 2+ 會自動以前一天最後一站當起點(通常是 hotel)。
            </div>
          )}

          <div className="flex gap-2 flex-wrap">
            <button
              onClick={setOriginFromHome}

    function ParticipantsPanel({ user, trip, profile, onUpdate }) {
      const [members, setMembers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [expanded, setExpanded] = useState(false);

      useEffect(() => {
        if (!user?.uid) return;
        const unsub = paths.knownFamily(user.uid).onSnapshot(
          (snap) => {
            const list = [];
            snap.forEach((doc) => list.push({ uid: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.totalTrips || 0) - (a.totalTrips || 0));
            setMembers(list);
            setLoading(false);
          },
          (e) => { console.warn('[Participants] snapshot error', e); setLoading(false); }
        );
        return unsub;
      }, [user?.uid]);

      const activeMembers = trip.activeMembers; // undefined = 預設全參與
      const isActive = (uid) => !activeMembers ? true : activeMembers.includes(uid);

      const toggle = (uid) => {
        if (!activeMembers) {
          // 首次明確編輯:把目前所有家人視為 active,然後移除剛點的這一位
          const allMinus = members.map((m) => m.uid).filter((u) => u !== uid);
          onUpdate({ activeMembers: allMinus });
        } else if (activeMembers.includes(uid)) {
          onUpdate({ activeMembers: activeMembers.filter((u) => u !== uid) });
        } else {
          onUpdate({ activeMembers: [...activeMembers, uid] });
        }
      };

      const activeCount = !activeMembers
        ? members.length
        : members.filter((m) => activeMembers.includes(m.uid)).length;

      return (
        <div className="bg-white rounded-xl border border-slate-200 mb-3">
          <button
            onClick={() => setExpanded((v) => !v)}
            className="w-full px-4 py-2 flex items-center justify-between hover:bg-slate-50 rounded-xl"
          >
            <span className="text-sm font-semibold text-slate-700 flex items-center gap-2">
              <span>👨‍👩‍👧 本次參與家人</span>
              <span className="text-xs text-slate-500 font-normal">
                {loading ? '載入中...' : members.length === 0 ? '尚無家人加入' : `${activeCount} / ${members.length} 人`}
              </span>
            </span>
            <span className="text-slate-400">{expanded ? '▲' : '▼'}</span>
          </button>
          {expanded && (
            <div className="px-4 pb-4 pt-1 border-t border-slate-100 space-y-3">
              {loading ? (
                <p className="text-sm text-slate-500">載入家人名單...</p>
              ) : members.length === 0 ? (
                <div className="text-sm text-slate-600 space-y-2">
                  <p>目前還沒有家人加入。把家庭分享連結傳給他們:</p>
                  {profile?.familyShareCode && <ShareLinkBox shareCode={profile.familyShareCode} />}
                </div>
              ) : (
                <>
                  <div className="space-y-1">
                    {members.map((m) => {
                      const checked = isActive(m.uid);
                      return (
                        <label
                          key={m.uid}
                          className={`flex items-center gap-2 p-2 rounded cursor-pointer transition ${checked ? 'bg-emerald-50 hover:bg-emerald-100' : 'bg-slate-50 hover:bg-slate-100 opacity-60'}`}
                        >
                          <input
                            type="checkbox"
                            checked={checked}
                            onChange={() => toggle(m.uid)}
                            className="rounded"
                          />
                          <span className="text-lg">{m.icon || '🙂'}</span>
                          <span className="text-sm font-medium text-slate-800 flex-1">{m.nickname || '(未命名)'}</span>
                          <span className="text-xs text-slate-500">
                            {m.totalTrips ? `參加 ${m.totalTrips} 次` : '新加入'}
                          </span>
                        </label>
                      );
                    })}
                  </div>
                  {!activeMembers && (
                    <p className="text-xs text-slate-400">
                      💡 預設全部參與。取消勾選任何一位,系統會記住本次行程的明確參與名單。
                    </p>
                  )}

    // ================================================================
