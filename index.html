                      {p.icon || '🙂'}
                    </span>
                    <div className="flex-1 min-w-0">
                      <div className="text-slate-800 truncate">
                        {p.nickname || '匿名'}{isMe && <span className="text-xs text-slate-500"> (你)</span>}
                      </div>
                      <div className="text-xs text-slate-500">
                        {hasGps ? `📍 更新於 ${ago}` : p.shareLocation === false ? '位置分享關閉' : '尚未上傳位置'}
                      </div>
                    </div>
                  </div>
                );
              })}
              {withGps.length > 0 && (
                <p className="text-[10px] text-slate-400 pt-1 border-t border-slate-100">
                  提示:位置只在 APP 開啟時更新,關閉手機或切走 APP 後就停止
                </p>
              )}
            </div>
          )}
        </div>
      );
    }

    // ================================================================
    // Mobile Trip View(規劃者 + 家人觀看者共用入口)
    // ================================================================
    function MobileTripView({ user, profile, tripId, ownerName, viewerProfile, sharedTripData, isViewer, twPOIs, poiState }) {
      const [trip, setTrip] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (isViewer) { setLoading(false); return; }
        if (!user || !tripId) { setLoading(false); return; }
        const unsub = paths.userTrip(user.uid, tripId).onSnapshot(
          (doc) => {
            if (doc.exists) setTrip({ id: doc.id, ...doc.data() });
            else setTrip(null);
            setLoading(false);
          },
          (e) => { console.error('[Mobile] trip listener', e); setLoading(false); }
        );
        return unsub;
      }, [isViewer, user, tripId]);

      if (isViewer) {
        return <ViewerMobileView user={user} ownerName={ownerName} viewerProfile={viewerProfile} sharedTripData={sharedTripData} />;
      }
      if (loading) return <LoadingScreen message="載入行程..." />;
      if (!trip) return <ErrorScreen title="找不到此行程" message="這個行程可能已被刪除,或網址錯誤" />;
      return <PlannerMobileView user={user} profile={profile} trip={trip} twPOIs={twPOIs} poiState={poiState} />;
    }

    // ================================================================
    // ViewerMobileView(家人觀看者視角 — Phase 5 完整版)
    // ================================================================
    function ViewerMobileView({ user, ownerName, viewerProfile, sharedTripData }) {
      const trip = sharedTripData;
      const days = trip?.days || [];
      const [dayIndex, setDayIndex] = useState(trip?.currentStatus?.currentDayIndex ?? 0);
      const [showNotes, setShowNotes] = useState(false);

      useEffect(() => {
        if (dayIndex >= days.length && days.length > 0) setDayIndex(Math.max(0, days.length - 1));
      }, [dayIndex, days.length]);

      const currentDay = days[dayIndex] || days[0];
      const locations = currentDay?.locations || [];
      const dayDepartureTime = trip ? getDayDepartureTime(currentDay, trip) : '09:00';
      const dayOrigin = useMemo(() => trip ? getDayOrigin(dayIndex, days, trip) : null, [trip, dayIndex, days]);

      // 排程(觀看者也算,僅顯示用)
      const [schedule, setSchedule] = useState([]);
      const scheduleTimerRef = useRef(null);
      const originKey = dayOrigin ? `${dayOrigin.lat?.toFixed(5)},${dayOrigin.lon?.toFixed(5)}` : 'none';
      const scheduleKey = useMemo(() =>
        locations.map((l) => `${l.id}|${l.lat?.toFixed(5)}|${l.lon?.toFixed(5)}|${l.estimatedStayMinutes ?? DEFAULT_STAY_BY_CATEGORY[l.category] ?? 60}|${l.reservation?.time || ''}|${l.status || 'pending'}`).join(';') + '@' + dayDepartureTime + '#' + originKey,
        [locations, dayDepartureTime, originKey]
      );
      useEffect(() => {
        if (!locations.length) { setSchedule([]); return; }
        if (scheduleTimerRef.current) clearTimeout(scheduleTimerRef.current);
        let cancelled = false;
        scheduleTimerRef.current = setTimeout(async () => {
          try {
            const result = await computeDaySchedule(dayDepartureTime, locations, dayOrigin);
            if (!cancelled) setSchedule(result);
          } catch (e) { if (!cancelled) setSchedule([]); }
        }, 500);
        return () => { cancelled = true; if (scheduleTimerRef.current) clearTimeout(scheduleTimerRef.current); };
      }, [scheduleKey]); // eslint-disable-line react-hooks/exhaustive-deps

      const tightness = useMemo(() => computeTightness(schedule), [schedule]);
      const scheduleByLocId = useMemo(() => {
        const m = {};
        schedule.forEach((s) => { m[s.locationId] = s; });
        return m;
      }, [schedule]);

      const nextStationIdx = locations.findIndex((l) => !l.status || l.status === 'pending' || l.status === 'visiting');
      const nextStation = nextStationIdx >= 0 ? locations[nextStationIdx] : null;
      const nextSchedule = nextStation ? scheduleByLocId[nextStation.id] : null;
      const visitedCount = locations.filter((l) => l.status === 'visited').length;
      const skippedCount = locations.filter((l) => l.status === 'skipped').length;
      const progressCount = visitedCount + skippedCount;

      // activeMembers 判定:null 或 undefined = 全員參與;陣列 = 明確清單
      const inActive = !trip?.activeMembers || (trip.activeMembers || []).includes(user?.uid);

      // Phase 5:GPS 上傳(只在參與名單中、且開啟分享位置時)
      useGpsUpload({
        tripId: trip?.tripRef || null,
        uid: user?.uid,
        enabled: !!(inActive && viewerProfile?.shareLocation && trip?.status === 'active'),
        nickname: viewerProfile?.nickname,
        icon: viewerProfile?.icon,
        color: viewerProfile?.color,
      });
      const participants = useParticipants(trip?.tripRef);

      const openNavigate = (loc) => {
        if (!loc || !isFinite(loc.lat) || !isFinite(loc.lon)) return;
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lon}&travelmode=driving`, '_blank');
      };

      // === 空狀態 ===
      if (!trip) {
        return (
          <div className="max-w-md mx-auto p-4 space-y-4 min-h-screen">
            <div className="flex items-center gap-2">
              <h1 className="text-xl font-bold text-slate-800 flex-1">{ownerName ? `${ownerName}'s Family` : '📱 旅程模式'}</h1>
            </div>
            {viewerProfile && (
              <div className="bg-white rounded-xl border border-slate-200 p-4 flex items-center gap-3">
                <div className="w-12 h-12 rounded-full flex items-center justify-center text-2xl" style={{ backgroundColor: viewerProfile.color }}>{viewerProfile.icon}</div>
                <div>
                  <div className="font-semibold text-slate-800">{viewerProfile.nickname}</div>
                  <div className="text-xs text-slate-500">位置分享:{viewerProfile.shareLocation ? '開啟' : '關閉'}</div>
                </div>
              </div>
            )}
            <div className="bg-white rounded-xl border border-slate-200 p-6 text-center text-slate-500">
              <div className="text-4xl mb-2">🗓️</div>
              <p>目前沒有進行中的行程</p>
              <p className="text-xs mt-2">當規劃者啟動行程時會自動顯示在這</p>
            </div>
          </div>
        );
      }

      // === 主畫面 ===
      return (
        <div className="max-w-md mx-auto p-3 space-y-3 min-h-screen pb-16">
          {/* 標題列 */}
          <div className="flex items-center gap-2">
            <h1 className="text-base font-bold text-slate-800 flex-1 truncate">{ownerName ? `${ownerName} · ${trip.title || '行程'}` : trip.title}</h1>
            {viewerProfile && (
              <span
                className="w-8 h-8 rounded-full flex items-center justify-center text-base flex-shrink-0"
                style={{ backgroundColor: viewerProfile.color }}
                title={viewerProfile.nickname}
              >
                {viewerProfile.icon}
              </span>
            )}
          </div>

          {/* 參與狀態提示 */}
          {!inActive && (
            <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm text-amber-800">
              ⚠️ 您不在本次行程的參與名單。仍可查看行程內容,但您的位置不會出現在多人位置中。
            </div>
          )}

          {/* 多人位置 */}
          {trip.status === 'active' && participants.length > 0 && (
            <ParticipantsBar participants={participants} currentUid={user?.uid} />
          )}

          {/* 多天 tabs */}
          {days.length > 1 && (
            <div className="flex items-center gap-1 overflow-x-auto -mx-1 px-1 pb-1">
              {days.map((d, i) => {
                const active = i === dayIndex;
                const dayLocs = d.locations || [];
                const done = dayLocs.filter((l) => l.status === 'visited' || l.status === 'skipped').length;
                return (
                  <button
                    key={i}
                    onClick={() => setDayIndex(i)}
                    className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-sm ${active ? 'bg-blue-500 text-white' : 'bg-slate-100 text-slate-700'}`}
                  >
                    Day {i + 1}
                    {d.date && <span className={`ml-1 text-xs ${active ? 'text-blue-100' : 'text-slate-500'}`}>{d.date.slice(5)}</span>}
                    <span className={`ml-1 text-xs ${active ? 'text-blue-100' : 'text-slate-400'}`}>{done}/{dayLocs.length}</span>
                  </button>
                );
              })}
            </div>
          )}

          {/* 進度 + 鬆緊度 */}
          {locations.length > 0 && (
            <div className="bg-white rounded-xl border border-slate-200 p-3 space-y-2">
              <div className="flex items-center gap-1 overflow-x-auto">
                {locations.map((loc, i) => {
                  const s = loc.status;
                  const isNext = i === nextStationIdx;
                  let cls = 'w-3 h-3 rounded-full flex-shrink-0';
                  if (s === 'visited') cls += ' bg-emerald-500';
                  else if (s === 'skipped') cls += ' bg-slate-300 opacity-50';
                  else if (isNext) cls += ' bg-blue-500 ring-2 ring-blue-200 w-4 h-4';
                  else cls += ' bg-slate-200';
                  return <span key={loc.id} className={cls}></span>;
                })}
                <span className="text-xs text-slate-500 ml-2 flex-shrink-0">{progressCount}/{locations.length} 站</span>
              </div>
              {tightness && schedule.length > 0 && (
                <div className={`text-xs ${tightness.cssText} flex items-center gap-2 flex-wrap`}>
                  <span className="font-semibold">{tightness.label}</span>
                  <span className="text-slate-600">
                    {dayOrigin?.name && <span className="text-slate-500">從 {dayOrigin.name} </span>}
                    {dayDepartureTime} 出發 → 預計 {schedule[schedule.length - 1]?.stayMin > 0 ? schedule[schedule.length - 1]?.departureTime : schedule[schedule.length - 1]?.arrivalTime} 結束
                  </span>
                </div>
              )}
            </div>
          )}

          {/* 下一站(read-only)*/}
          {nextStation && (
            <MobileNextStationCard
              location={nextStation}
              scheduleEntry={nextSchedule}
              dayOriginName={dayOrigin?.name}
              isFirst={nextStationIdx === 0}
              readOnly={true}
              onNavigate={() => openNavigate(nextStation)}
            />
          )}

          {!nextStation && locations.length > 0 && (
            <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-center">
              <div className="text-3xl mb-1">🎉</div>
              <div className="font-semibold text-emerald-800">Day {dayIndex + 1} 全部完成!</div>
            </div>
          )}

          {/* 今日清單(read-only)*/}
          {locations.length > 0 ? (
            <div className="bg-white rounded-xl border border-slate-200 p-3 space-y-2">
              <h2 className="text-sm font-semibold text-slate-700">📋 Day {dayIndex + 1} 今日行程</h2>
              <div className="space-y-1.5">
                {locations.map((loc, idx) => (
                  <MobileLocationRow
                    key={loc.id}
                    location={loc}
                    index={idx}
                    total={locations.length}
                    scheduleEntry={scheduleByLocId[loc.id]}
                    isNext={idx === nextStationIdx}
                    expenses={[]}
                    readOnly={true}
                    onNavigate={() => openNavigate(loc)}
                  />
                ))}
              </div>
            </div>
          ) : (
            <div className="bg-white rounded-xl border border-slate-200 p-6 text-center text-slate-500">
              <p className="text-sm">Day {dayIndex + 1} 還沒有景點</p>
            </div>
          )}

          {/* 行程總備註 */}
          {trip.notes && (
            <div className="bg-white rounded-xl border border-slate-200">
              <button
                onClick={() => setShowNotes((v) => !v)}
                className="w-full px-3 py-2 flex items-center justify-between hover:bg-slate-50 rounded-xl text-sm"
              >
                <span className="font-semibold text-slate-700">📝 規劃者備註</span>
                <span className="text-slate-400">{showNotes ? '▲' : '▼'}</span>
              </button>
              {showNotes && (
                <div className="px-3 pb-3 text-sm text-slate-700 whitespace-pre-wrap break-words border-t border-slate-100 pt-2">
                  {trip.notes}
                </div>
              )}
            </div>
          )}

          {/* 共享相簿 */}
          {trip.sharedAlbumUrl && (
            <a
              href={trip.sharedAlbumUrl}
              target="_blank"
              rel="noopener noreferrer"
              className="block w-full text-center px-3 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-sm font-medium"
            >
              📷 {trip.sharedAlbumLabel || '上傳照片到共享相簿'}
            </a>
          )}
        </div>
      );
    }

    // ================================================================
    // 規劃者 PlannerMobileView(旅程進行中的手機操作介面)
    // ================================================================
    function PlannerMobileView({ user, profile, trip, twPOIs, poiState }) {
      const days = trip.days?.length ? trip.days : [{ dayNumber: 1, date: '', locations: [] }];
      const initialDayIndex = Math.min(trip.currentStatus?.currentDayIndex ?? 0, days.length - 1);
      const [dayIndex, setDayIndex] = useState(initialDayIndex);
      const [showMap, setShowMap] = useState(false);
      const [showNotes, setShowNotes] = useState(false);
      const [showExpenses, setShowExpenses] = useState(false);
      const [expensePresetLocId, setExpensePresetLocId] = useState(null);
      const [editMode, setEditMode] = useState(false);

      // Phase 5:初次載入時也 sync 一次
      const initialSyncDoneRef = useRef(false);
      useEffect(() => {
        if (!trip || !profile?.familyShareCode || initialSyncDoneRef.current) return;
        initialSyncDoneRef.current = true;
        syncTripToShared(trip, profile.familyShareCode);
      }, [trip, profile?.familyShareCode]);

      // Phase 5:規劃者進入 mobile 旅程模式時也上傳自己位置(只有 active 才上傳)
      useGpsUpload({
        tripId: trip.id,
        uid: user.uid,
        enabled: trip.status === 'active',
        nickname: profile?.nickname || '我',
        icon: profile?.icon || '🚙',
        color: profile?.color || '#3B82F6',
      });
      const participants = useParticipants(trip.id);

      // 確保 dayIndex 不會超出範圍(若使用者在編輯端刪天)
      useEffect(() => {
        if (dayIndex >= days.length) setDayIndex(Math.max(0, days.length - 1));
      }, [dayIndex, days.length]);

      const currentDay = days[dayIndex] || days[0];
      const locations = currentDay.locations || [];
      const dayDepartureTime = getDayDepartureTime(currentDay, trip);
      const dayOrigin = useMemo(() => getDayOrigin(dayIndex, days, trip), [trip, dayIndex, days]);

      // === 排程 ===
      const [schedule, setSchedule] = useState([]);
      const [scheduleLoading, setScheduleLoading] = useState(false);
      const scheduleTimerRef = useRef(null);
      const originKey = dayOrigin ? `${dayOrigin.lat?.toFixed(5)},${dayOrigin.lon?.toFixed(5)}` : 'none';
      const scheduleKey = useMemo(() =>
        locations.map((l) => `${l.id}|${l.lat?.toFixed(5)}|${l.lon?.toFixed(5)}|${l.estimatedStayMinutes ?? DEFAULT_STAY_BY_CATEGORY[l.category] ?? 60}|${l.reservation?.time || ''}|${l.status || 'pending'}`).join(';') + '@' + dayDepartureTime + '#' + originKey,
        [locations, dayDepartureTime, originKey]
      );
      useEffect(() => {
        if (!locations.length) { setSchedule([]); return; }
        if (scheduleTimerRef.current) clearTimeout(scheduleTimerRef.current);
        setScheduleLoading(true);
        let cancelled = false;
        scheduleTimerRef.current = setTimeout(async () => {
          try {
            const result = await computeDaySchedule(dayDepartureTime, locations, dayOrigin);
            if (!cancelled) setSchedule(result);
          } catch (e) {
            if (!cancelled) setSchedule([]);
          } finally {
            if (!cancelled) setScheduleLoading(false);
          }
        }, 500);
        return () => { cancelled = true; if (scheduleTimerRef.current) clearTimeout(scheduleTimerRef.current); };
      }, [scheduleKey]); // eslint-disable-line react-hooks/exhaustive-deps

      const tightness = useMemo(() => computeTightness(schedule), [schedule]);
      const scheduleByLocId = useMemo(() => {
        const m = {};
        schedule.forEach((s) => { m[s.locationId] = s; });
        return m;
      }, [schedule]);

      // === Trip 寫入 helper ===
      const updateTrip = async (updates) => {
        await paths.userTrip(user.uid, trip.id).update({
          ...updates,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        // Phase 5:同步公開快照
        if (profile?.familyShareCode) {
          const merged = { ...trip, ...updates, id: trip.id };
          syncTripToShared(merged, profile.familyShareCode);
        }
      };

      const saveDayLocations = (newLocations) => {
        const newDays = days.map((d, i) => i === dayIndex ? { ...d, locations: newLocations } : d);
        return updateTrip({ days: newDays });
      };

      // === 找下一站 ===
      // 規則:第一個 status != 'visited' && status != 'skipped' 的就是「下一站」
      const nextStationIdx = locations.findIndex((l) => !l.status || l.status === 'pending' || l.status === 'visiting');
      const nextStation = nextStationIdx >= 0 ? locations[nextStationIdx] : null;
      const nextSchedule = nextStation ? scheduleByLocId[nextStation.id] : null;

      // === 狀態統計 ===
      const visitedCount = locations.filter((l) => l.status === 'visited').length;
      const skippedCount = locations.filter((l) => l.status === 'skipped').length;
      const progressCount = visitedCount + skippedCount;

      // === Status 操作 ===
      const handleArrived = (locId) => {
        const now = Date.now();
        const next = locations.map((l) => l.id === locId ? {
          ...l,
          status: 'visited',
          arrivedAt: l.arrivedAt || now,
          leftAt: now,
          // 抵達祕密景點自動揭曉
          revealedAt: l.isSurprise && !l.revealedAt ? now : l.revealedAt,
        } : l);
        saveDayLocations(next);
      };

      const handleSkip = (locId) => {
        const loc = locations.find((l) => l.id === locId);
        if (!loc) return;
        if (loc.priority === 'must' && !window.confirm(`「${loc.name}」標為「必去」,確定要跳過嗎?`)) return;
        const next = locations.map((l) => l.id === locId ? {
          ...l, status: 'skipped', skippedAt: Date.now(),
        } : l);
        saveDayLocations(next);
      };

      const handleUndoStatus = (locId) => {
        const next = locations.map((l) => l.id === locId ? {
          ...l,
          status: 'pending',
          arrivedAt: null, leftAt: null, skippedAt: null,
        } : l);
        saveDayLocations(next);
      };

      const handleNavigate = (loc) => {
        if (!loc || !isFinite(loc.lat) || !isFinite(loc.lon)) return;
        const url = `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lon}&travelmode=driving`;
        window.open(url, '_blank');
      };

      const handleRevealSurprise = (locId) => {
        const next = locations.map((l) => l.id === locId ? { ...l, revealedAt: Date.now() } : l);
        saveDayLocations(next);
      };

      // === 編輯動作(規劃者快速編輯模式)===
      const handleAddNewLocation = (result) => {
        const source = result.source || 'osm';
        const isOriginLike = source === 'home' || source === 'current';
        const category = result.category || (isOriginLike ? source : 'custom');
        const defaultStay = isOriginLike ? 0 : (DEFAULT_STAY_BY_CATEGORY[category] ?? 60);
        const newLoc = {
          id: result.id?.startsWith('loc_') ? result.id : generateLocationId(),
          name: result.name,
          originalName: result.originalName || result.name,
          address: result.address || '',
          lat: result.lat,
          lon: result.lon,
          source,
          category,
          opening_hours: result.opening_hours || '',
          estimatedStayMinutes: defaultStay,
          priority: 'optional',
          notes: '',
          phone: '',
        };
        saveDayLocations([...locations, newLoc]);
      };
      const handleAddHomeMobile = () => {
        if (!profile?.home?.lat || !profile?.home?.lon) {
          alert('尚未設定住家。請到 ⚙️ 設定 設好住家後再試。');
          return;
        }
        handleAddNewLocation({
          name: profile.home.name || '住家',
          address: profile.home.address || '',
          lat: profile.home.lat,
          lon: profile.home.lon,
          source: 'home',
        });
      };
      const handleAddCurrentMobile = () => {
        if (!navigator.geolocation) { alert('此瀏覽器不支援定位'); return; }
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const { latitude: lat, longitude: lon } = pos.coords;
            let name = '目前位置';
            let address = '';
            try {
              const geo = await reverseGeocode(lat, lon);
              if (geo?.name) name = geo.name;
              if (geo?.address) address = geo.address;
            } catch (_) { /* ignore */ }
            handleAddNewLocation({ name, address, lat, lon, source: 'current' });
          },
          (err) => alert('取得位置失敗:' + err.message),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
      };
      const handleMoveLocationMobile = (idx, delta) => {
        const newIdx = idx + delta;
        if (newIdx < 0 || newIdx >= locations.length) return;
        const next = [...locations];
        [next[idx], next[newIdx]] = [next[newIdx], next[idx]];
        saveDayLocations(next);
      };
      const handleDeleteLocationMobile = (idx) => {
        if (!window.confirm(`移除「${locations[idx].name}」?`)) return;
        saveDayLocations(locations.filter((_, i) => i !== idx));
      };

      // 沿途推薦「加入順遊」:插到「下一站」之後
      const handleAddNearby = (poi) => {
        const category = poi.category || 'custom';
        const defaultStay = DEFAULT_STAY_BY_CATEGORY[category] ?? 60;
        const newLoc = {
          id: generateLocationId(),
          name: poi.name,
          originalName: poi.name,
          address: poi.address || '',
          lat: poi.lat,
          lon: poi.lon,
          source: poi.source || 'osm',
          category,
          opening_hours: '',
          estimatedStayMinutes: defaultStay,
          priority: 'optional',
          notes: '',
          phone: '',
        };
        // 插入「下一站之後」(讓使用者先去原本的下一站,再去推薦的)
        const insertIdx = nextStationIdx >= 0 ? nextStationIdx + 1 : locations.length;
        const next = [...locations.slice(0, insertIdx), newLoc, ...locations.slice(insertIdx)];
        saveDayLocations(next);
      };

      // === 費用 handlers(與 Editor 共用模式)===
      const expenses = trip.expenses || [];
      const handleAddExpense = (data) => {
        const newExpense = {
          id: 'exp_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          amount: data.amount,
          category: data.category,
          description: data.description || '',
          paid: !!data.paid,
          relatedLocationId: data.relatedLocationId || null,
          addedAt: Date.now(),
        };
        updateTrip({ expenses: [...expenses, newExpense] });
        setExpensePresetLocId(null);
      };
      const handleDeleteExpense = (id) => {
        if (!window.confirm('刪除這筆費用?')) return;
        updateTrip({ expenses: expenses.filter((e) => e.id !== id) });
      };
      const handleToggleExpensePaid = (id) => {
        updateTrip({ expenses: expenses.map((e) => e.id === id ? { ...e, paid: !e.paid } : e) });
      };

      // === Render ===
      return (
        <div className="max-w-md mx-auto p-3 space-y-3 min-h-screen pb-16">
          {/* 標題列 */}
          <div className="flex items-center gap-2">
            <button onClick={() => navigate('#/')} className="p-2 hover:bg-slate-200 rounded-lg flex-shrink-0">←</button>
            <h1 className="text-base font-bold text-slate-800 flex-1 truncate">{trip.title || '未命名行程'}</h1>
            <button
              onClick={() => { setExpensePresetLocId(null); setShowExpenses((v) => !v); }}
              title="費用(規劃者私有)"
              className={`px-2 py-1 rounded text-xs border ${showExpenses ? 'bg-amber-500 text-white border-amber-500' : 'bg-amber-50 text-amber-800 border-amber-300'}`}
            >
              💰
            </button>
            <button
              onClick={() => setEditMode((v) => !v)}
              title={editMode ? '完成編輯' : '快速編輯模式'}
              className={`px-2 py-1 rounded text-xs border ${editMode ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100'}`}
            >
              {editMode ? '✅ 完成' : '✏️'}
            </button>
          </div>

          {/* 編輯模式:加入景點搜尋 */}
          {editMode && (
            <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 space-y-2">
              <div className="flex items-center justify-between text-xs">
                <span className="font-semibold text-emerald-800">✏️ 編輯 Day {dayIndex + 1}</span>
                <a
                  href={`#/edit/${trip.id}`}
                  className="text-sky-700 hover:underline"
                >
                  🖥️ 桌面完整版
                </a>
              </div>
              <SearchPanel
                twPOIs={twPOIs}
                poiState={poiState}
                onAdd={handleAddNewLocation}
                onAddHome={handleAddHomeMobile}
                onAddCurrent={handleAddCurrentMobile}
                hasHome={!!profile?.home?.lat}
              />
            </div>
          )}

          {/* 費用面板 */}
          {showExpenses && (
            <ExpensePanel
              expenses={expenses}
              locations={locations}
              onAdd={handleAddExpense}
              onDelete={handleDeleteExpense}
              onTogglePaid={handleToggleExpensePaid}
              onClose={() => { setShowExpenses(false); setExpensePresetLocId(null); }}
              presetLocationId={expensePresetLocId}
            />
          )}

          {/* 多人位置 */}
          {trip.status === 'active' && participants.length > 0 && (
            <ParticipantsBar participants={participants} currentUid={user.uid} />
          )}

          {/* 多天 tabs */}
          {days.length > 1 && (
            <div className="flex items-center gap-1 overflow-x-auto -mx-1 px-1 pb-1">
              {days.map((d, i) => {
                const active = i === dayIndex;
                const dayLocs = d.locations || [];
                const done = dayLocs.filter((l) => l.status === 'visited' || l.status === 'skipped').length;
                return (
                  <button
                    key={i}
                    onClick={() => setDayIndex(i)}
                    className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-sm ${active ? 'bg-blue-500 text-white' : 'bg-slate-100 text-slate-700'}`}
                  >
                    Day {i + 1}
                    {d.date && <span className={`ml-1 text-xs ${active ? 'text-blue-100' : 'text-slate-500'}`}>{d.date.slice(5)}</span>}
                    <span className={`ml-1 text-xs ${active ? 'text-blue-100' : 'text-slate-400'}`}>{done}/{dayLocs.length}</span>
                  </button>
                );
              })}
            </div>
          )}

          {/* 鬆緊度 / 進度 */}
          {locations.length > 0 && (
            <div className="bg-white rounded-xl border border-slate-200 p-3 space-y-2">
              {/* 進度條 */}
              <div className="flex items-center gap-1 overflow-x-auto">
                {locations.map((loc, i) => {
                  const s = loc.status;
                  const isNext = i === nextStationIdx;
                  let cls = 'w-3 h-3 rounded-full flex-shrink-0';
                  if (s === 'visited') cls += ' bg-emerald-500';
                  else if (s === 'skipped') cls += ' bg-slate-300 opacity-50';
                  else if (isNext) cls += ' bg-blue-500 ring-2 ring-blue-200 w-4 h-4';
                  else cls += ' bg-slate-200';
                  return <span key={loc.id} className={cls} title={`${i + 1}. ${loc.name} (${s || 'pending'})`}></span>;
                })}
                <span className="text-xs text-slate-500 ml-2 flex-shrink-0">{progressCount}/{locations.length} 站</span>
              </div>
              {tightness && (
                <div className={`text-xs ${tightness.cssText} flex items-center gap-2 flex-wrap`}>
                  <span className="font-semibold">{tightness.label}</span>
                  <span className="text-slate-600">
                    {dayOrigin?.name && <span className="text-slate-500">從 {dayOrigin.name} </span>}
                    {dayDepartureTime} 出發 → 預計 {schedule[schedule.length - 1]?.stayMin > 0 ? schedule[schedule.length - 1]?.departureTime : schedule[schedule.length - 1]?.arrivalTime} 結束
                  </span>
                  {scheduleLoading && <span className="text-slate-400">⏳</span>}
                </div>
              )}
            </div>
          )}

          {/* 下一站醒目卡片 */}
          {nextStation && (
            <MobileNextStationCard
              location={nextStation}
              scheduleEntry={nextSchedule}
              dayOriginName={dayOrigin?.name}
              isFirst={nextStationIdx === 0}
              onNavigate={() => handleNavigate(nextStation)}
              onArrived={() => handleArrived(nextStation.id)}
              onSkip={() => handleSkip(nextStation.id)}
              onRevealSurprise={() => handleRevealSurprise(nextStation.id)}
            />
          )}

          {!nextStation && locations.length > 0 && (
            <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-center">
              <div className="text-3xl mb-1">🎉</div>
              <div className="font-semibold text-emerald-800">Day {dayIndex + 1} 全部完成!</div>
              <div className="text-xs text-emerald-700 mt-1">
                造訪 {visitedCount} 站,跳過 {skippedCount} 站
              </div>
            </div>
          )}

          {/* 今日全部行程 */}
          {locations.length > 0 ? (
            <div className="bg-white rounded-xl border border-slate-200 p-3 space-y-2">
              <h2 className="text-sm font-semibold text-slate-700">📋 Day {dayIndex + 1} 今日行程</h2>
              <div className="space-y-1.5">
                {locations.map((loc, idx) => (
                  <MobileLocationRow
                    key={loc.id}
                    location={loc}
                    index={idx}
                    total={locations.length}
                    scheduleEntry={scheduleByLocId[loc.id]}
                    isNext={idx === nextStationIdx}
                    expenses={expenses}
                    editMode={editMode}
                    onNavigate={() => handleNavigate(loc)}
                    onArrived={() => handleArrived(loc.id)}
                    onSkip={() => handleSkip(loc.id)}
                    onUndo={() => handleUndoStatus(loc.id)}
                    onRevealSurprise={() => handleRevealSurprise(loc.id)}
                    onMove={(delta) => handleMoveLocationMobile(idx, delta)}
                    onDelete={() => handleDeleteLocationMobile(idx)}
                  />
                ))}
              </div>
            </div>
          ) : (
            <div className="bg-white rounded-xl border border-slate-200 p-6 text-center text-slate-500">
              <p className="text-sm">Day {dayIndex + 1} 還沒加入任何景點</p>
              <button onClick={() => navigate(`#/edit/${trip.id}`)} className="mt-3 px-3 py-1.5 bg-blue-500 text-white rounded-lg text-sm">
                ✏️ 回 Editor 規劃
              </button>
            </div>
          )}

          {/* 行程總備註(可折疊)*/}
          {trip.notes && (
            <div className="bg-white rounded-xl border border-slate-200">
              <button
                onClick={() => setShowNotes((v) => !v)}
                className="w-full px-3 py-2 flex items-center justify-between hover:bg-slate-50 rounded-xl text-sm"
              >
                <span className="font-semibold text-slate-700">📝 行程總備註</span>
                <span className="text-slate-400">{showNotes ? '▲' : '▼'}</span>
              </button>
              {showNotes && (
                <div className="px-3 pb-3 text-sm text-slate-700 whitespace-pre-wrap break-words border-t border-slate-100 pt-2">
                  {trip.notes}
                </div>
              )}
            </div>
          )}

          {/* 沿途推薦(以下一站為中心 3km 內)*/}
          {nextStation && (
            <NearbyRecommendations
              centerLat={nextStation.lat}
              centerLon={nextStation.lon}
              anchorName={nextStation.name}
              onAddNearby={handleAddNearby}
            />
          )}

          {/* 共享相簿入口 */}
          {trip.sharedAlbumUrl && (
            <a
              href={trip.sharedAlbumUrl}
              target="_blank"
              rel="noopener noreferrer"
              className="block w-full text-center px-3 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-sm font-medium"
            >
              📷 {trip.sharedAlbumLabel || '上傳照片到共享相簿'}
            </a>
          )}
        </div>
      );
    }

    // ================================================================
    // 沿途推薦(查詢下一站附近的 OSM POI)
    // ================================================================
    function NearbyRecommendations({ centerLat, centerLon, anchorName, onAddNearby }) {
      const [data, setData] = useState({ attraction: [], restaurant: [], toilets: [], fuel: [] });
      const [loading, setLoading] = useState(false);
      const [open, setOpen] = useState({}); // { restaurant: true } 等

      useEffect(() => {
        if (!isFinite(centerLat) || !isFinite(centerLon)) return;
        let cancelled = false;
        setLoading(true);
        fetchNearbyPOIs(centerLat, centerLon, 3000)
          .then((grouped) => { if (!cancelled) setData(grouped); })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [centerLat, centerLon]);

      const sections = [
        { key: 'restaurant', emoji: '🍽️', label: '沿途餐廳' },
        { key: 'attraction', emoji: '🏞️', label: '沿途景點' },
        { key: 'toilets', emoji: '🚻', label: '附近廁所' },
        { key: 'fuel', emoji: '⛽', label: '附近加油站' },
      ];

      const hasAny = sections.some((s) => data[s.key].length > 0);
      if (!loading && !hasAny) return null;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-3 space-y-2">
          <h2 className="text-sm font-semibold text-slate-700">
            🧭 附近推薦 <span className="text-xs text-slate-400 font-normal">(以「{anchorName || '下一站'}」3 km 內)</span>
          </h2>
          {loading && <p className="text-xs text-slate-500">⏳ 查詢中...</p>}
          {sections.map((s) => {
            const list = data[s.key] || [];
            if (list.length === 0) return null;
            const isOpen = !!open[s.key];
            return (
              <div key={s.key} className="border border-slate-100 rounded-lg">
                <button
                  onClick={() => setOpen((o) => ({ ...o, [s.key]: !o[s.key] }))}
                  className="w-full px-3 py-2 flex items-center justify-between hover:bg-slate-50 rounded-lg text-sm"
                >
                  <span>{s.emoji} {s.label} <span className="text-xs text-slate-400">({list.length})</span></span>
                  <span className="text-slate-400 text-xs">{isOpen ? '▲' : '▼'}</span>
                </button>
                {isOpen && (
                  <div className="px-3 pb-2 space-y-1 border-t border-slate-100 pt-2">
                    {list.slice(0, 5).map((poi) => (
                      <div key={poi.id} className="flex items-center gap-2 text-sm">
                        <div className="flex-1 min-w-0">
                          <div className="text-slate-800 truncate">{poi.name}</div>
                          <div className="text-xs text-slate-500">{(poi.distanceKm * 1000).toFixed(0)} m 距離</div>
                        </div>
                        {onAddNearby && (
                          <button
                            onClick={() => onAddNearby({
                              name: poi.name,
                              lat: poi.lat,
                              lon: poi.lon,
                              source: 'osm',
                              category: s.key === 'restaurant' ? 'restaurant' : s.key === 'attraction' ? 'scenic' : s.key === 'toilets' ? 'rest' : 'gas',
                            })}
                            className="flex-shrink-0 px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 rounded text-xs"
                          >
                            + 加入順遊
                          </button>
                        )}
                      </div>
                    ))}
                    {list.length > 5 && <p className="text-xs text-slate-400 text-center">還有 {list.length - 5} 個未顯示</p>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    // ================================================================
    // 下一站大卡片
    // ================================================================
    function MobileNextStationCard({ location, scheduleEntry, dayOriginName, isFirst, readOnly, onNavigate, onArrived, onSkip, onRevealSurprise }) {
      const showSurpriseControls = location.isSurprise && !location.revealedAt;
      const distKm = scheduleEntry?.distanceKm;
      const travelMin = scheduleEntry?.travelMin;

      return (
        <div className="bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-2xl p-4 shadow-md space-y-3">
          <div className="flex items-center justify-between text-xs opacity-90">
            <span>📍 下一站</span>
            {location.priority === 'must' && <span className="bg-amber-300 text-amber-900 px-1.5 py-0.5 rounded">⭐ 必去</span>}
          </div>
          <div className="flex items-start gap-2">
            {location.isSurprise && (
              <span className="text-2xl">{location.revealedAt ? '✨' : '🎁'}</span>
            )}
            <div className="flex-1 min-w-0">
              <div className="text-xl font-bold leading-tight break-words">{location.name}</div>
              {location.address && (
                <div className="text-xs opacity-80 mt-0.5 break-words">{location.address}</div>
              )}
            </div>
          </div>

          {scheduleEntry && (
            <div className="flex items-center gap-3 text-sm flex-wrap">
              {travelMin > 0 && (
                <span>🚗 {travelMin} 分{distKm > 0 && ` · ${distKm.toFixed(1)} km`}</span>
              )}
              <span>🕘 預計 {scheduleEntry.arrivalTime} 抵達</span>
              {scheduleEntry.warnings?.some((w) => w.type === 'late') && (
                <span className="bg-red-300 text-red-900 px-1.5 py-0.5 rounded text-xs">
                  ⚠ 將遲到 {scheduleEntry.warnings.find((w) => w.type === 'late').minutes} 分
                </span>
              )}
            </div>
          )}

          {isFirst && dayOriginName && travelMin > 0 && (
            <div className="text-xs opacity-80">從 {dayOriginName} 出發</div>
          )}

          {location.opening_hours && (
            <div className="text-xs opacity-90 break-words">⏰ {location.opening_hours}</div>
          )}

          {location.reservation?.time && (
            <div className="bg-purple-300 text-purple-900 px-2 py-1 rounded text-xs">
              📌 預約 {location.reservation.time}{location.reservation.party ? ` (${location.reservation.party} 人)` : ''}
            </div>
          )}

          {readOnly ? (
            <button
              onClick={onNavigate}
              className="w-full px-3 py-2 bg-white text-blue-700 rounded-lg text-sm font-medium hover:bg-blue-50"
            >
              🚗 開導航前往
            </button>
          ) : (
            <>
              <div className="grid grid-cols-3 gap-2 pt-1">
                <button
                  onClick={onNavigate}
                  className="px-2 py-2 bg-white text-blue-700 rounded-lg text-sm font-medium hover:bg-blue-50"
                >
                  🚗 導航
                </button>
                <button
                  onClick={onArrived}
                  className="px-2 py-2 bg-emerald-400 text-emerald-900 rounded-lg text-sm font-medium hover:bg-emerald-300"
                >
                  ✅ 我到了
                </button>
                <button
                  onClick={onSkip}
                  className="px-2 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-200"
                >
                  ⏭️ 跳過
                </button>
              </div>

              {showSurpriseControls && (
                <button
                  onClick={onRevealSurprise}
                  className="w-full px-3 py-1.5 bg-purple-300 text-purple-900 rounded-lg text-sm font-medium hover:bg-purple-200"
                >
                  ✨ 提前揭曉(讓家人看到真名)
                </button>
              )}
            </>
          )}
        </div>
      );
    }

    // ================================================================
    // 今日清單一列(緊湊版)
    // ================================================================
    function MobileLocationRow({ location, index, total, scheduleEntry, isNext, expenses, editMode, readOnly, onNavigate, onArrived, onSkip, onUndo, onRevealSurprise, onMove, onDelete }) {
      const s = location.status;
      const statusIcon = s === 'visited' ? '✅' : s === 'skipped' ? '⏭️' : isNext ? '📍' : '⬇️';
      const dimmed = s === 'skipped';
      const expenseTotal = expenses
        .filter((e) => e.relatedLocationId === location.id)
        .reduce((sum, e) => sum + (e.amount || 0), 0);

      return (
        <div
          className={`p-2 rounded-lg border transition ${
            isNext ? 'bg-blue-50 border-blue-300' :
            s === 'visited' ? 'bg-emerald-50 border-emerald-200' :
            s === 'skipped' ? 'bg-slate-50 border-slate-200 opacity-60' :
            'bg-white border-slate-200'
          }`}
        >
          {scheduleEntry && index > 0 && scheduleEntry.travelMin > 0 && (
            <div className="text-xs text-slate-500 mb-0.5">
              🚗 {scheduleEntry.travelMin} 分 · {scheduleEntry.distanceKm?.toFixed(1)} km
            </div>
          )}
          <div className="flex items-start gap-2">
            <span className="text-base flex-shrink-0 leading-tight">{statusIcon}</span>
            <span className="text-xs text-slate-500 flex-shrink-0 leading-tight pt-0.5">{index + 1}.</span>
            <div className="flex-1 min-w-0">
              <div className="text-sm font-medium text-slate-800 break-words flex items-center gap-1 flex-wrap">
                {location.isSurprise && (
                  <span title={location.revealedAt ? '已揭曉' : `家人看到:${location.surpriseAlias || '🎁 驚喜景點'}`}>
                    {location.revealedAt ? '✨' : '🎁'}
                  </span>
                )}
                <span className={dimmed ? 'line-through' : ''}>{location.name}</span>
                {location.priority === 'must' && <span className="text-amber-500">⭐</span>}
              </div>
              {scheduleEntry && (
                <div className="text-xs text-slate-600 mt-0.5">
                  🕘 {scheduleEntry.arrivalTime}
                  {scheduleEntry.stayMin > 0 && <span className="text-slate-500"> → {scheduleEntry.departureTime}</span>}
                </div>
              )}
              {location.reservation?.time && (
                <div className="text-xs text-purple-600 mt-0.5">📌 預約 {location.reservation.time}</div>
              )}
              {location.phone && (
                <a href={`tel:${location.phone.replace(/[^0-9+]/g, '')}`} className="text-xs text-emerald-600 hover:underline mt-0.5 inline-block">
                  📞 {location.phone}
                </a>
              )}
              {location.notes && (
                <div className="text-xs text-slate-600 mt-0.5 break-words line-clamp-2">📝 {location.notes}</div>
              )}
              {expenseTotal > 0 && (
                <div className="text-xs text-amber-700 mt-0.5">💰 NT$ {expenseTotal.toLocaleString()}</div>
              )}
              {s === 'visited' && location.leftAt && (
                <div className="text-[10px] text-emerald-600 mt-0.5">已抵達 · {new Date(location.leftAt).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false })}</div>
              )}
              {s === 'skipped' && location.skippedAt && (
                <div className="text-[10px] text-slate-500 mt-0.5">跳過 · {new Date(location.skippedAt).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false })}</div>
              )}
            </div>
          </div>

          {/* 個別操作:read-only(觀看者)隱藏所有動作;編輯模式優先 */}
          {readOnly ? (
            <div className="flex gap-1 mt-1.5">
              <button onClick={onNavigate} className="text-xs px-2 py-0.5 bg-slate-100 hover:bg-slate-200 rounded">🚗 導航</button>
            </div>
          ) : editMode ? (
            <div className="flex gap-1 mt-1.5 flex-wrap">
              <button
                onClick={() => onMove && onMove(-1)}
                disabled={index === 0}
                className="text-xs px-2 py-0.5 bg-slate-100 hover:bg-slate-200 rounded disabled:opacity-30"
              >
                ↑ 上移
              </button>
              <button
                onClick={() => onMove && onMove(1)}
                disabled={index === total - 1}
                className="text-xs px-2 py-0.5 bg-slate-100 hover:bg-slate-200 rounded disabled:opacity-30"
              >
                ↓ 下移
              </button>
              {location.isSurprise && !location.revealedAt && (
                <button onClick={onRevealSurprise} className="text-xs px-2 py-0.5 bg-purple-100 hover:bg-purple-200 text-purple-800 rounded">
                  ✨ 揭曉
                </button>
              )}
              <button onClick={onDelete} className="text-xs px-2 py-0.5 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 rounded ml-auto">
                🗑 移除
              </button>
            </div>
          ) : (
            <div className="flex gap-1 mt-1.5 flex-wrap">
              {!s || s === 'pending' || s === 'visiting' ? (
                <>
                  <button onClick={onNavigate} className="text-xs px-2 py-0.5 bg-slate-100 hover:bg-slate-200 rounded">🚗 導航</button>
                  <button onClick={onArrived} className="text-xs px-2 py-0.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded">✅ 我到了</button>
                  <button onClick={onSkip} className="text-xs px-2 py-0.5 bg-slate-100 hover:bg-slate-200 rounded">⏭️ 跳過</button>
                  {location.isSurprise && !location.revealedAt && (
                    <button onClick={onRevealSurprise} className="text-xs px-2 py-0.5 bg-purple-100 hover:bg-purple-200 text-purple-800 rounded">✨ 揭曉</button>
                  )}
                </>
              ) : (
                <button onClick={onUndo} className="text-xs px-2 py-0.5 bg-slate-100 hover:bg-slate-200 rounded">↶ 撤回</button>
              )}
            </div>
          )}
        </div>
      );
    }

    // ================================================================
    // App Root
    // ================================================================
    function App() {
      // 狀態 ===
      const [authReady, setAuthReady] = useState(false);
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [profileLoading, setProfileLoading] = useState(false);
      const [route, setRoute] = useState(parseRoute());

      const [familyCodeUrl] = useState(getUrlFamilyCode());
      const [familyOwner, setFamilyOwner] = useState(null);
      const [familyOwnerError, setFamilyOwnerError] = useState(null);
      const [viewerProfile, setViewerProfile] = useState(null);
      const [needsFamilySetup, setNeedsFamilySetup] = useState(false);
      const [sharedTripData, setSharedTripData] = useState(null);

      const [googleBusy, setGoogleBusy] = useState(false);
      const [appError, setAppError] = useState(firebaseInitError);

      // Phase 2:觀光署 POI
      const [twPOIs, setTwPOIs] = useState([]);
      const [poiState, setPoiState] = useState(null);

      const isViewer = !!familyCodeUrl;

      // === Hash 路由監聽 ===
      useEffect(() => {
        const handler = () => setRoute(parseRoute());
        window.addEventListener('hashchange', handler);
        return () => window.removeEventListener('hashchange', handler);
      }, []);

      // === Phase 2:背景載入觀光署 POI(僅規劃者需要)===
      useEffect(() => {
        if (isViewer) return;
        let cancelled = false;
        loadTwPOIs({ onProgress: (s) => { if (!cancelled) setPoiState(s); } })
          .then((items) => {
            if (cancelled) return;
            setTwPOIs(items);
            setPoiState((prev) => prev?.phase === 'cached' ? prev : { phase: 'done', count: items.length });
          })
          .catch((e) => {
            if (cancelled) return;
            console.error('[POI] load failed', e);
            setPoiState({ phase: 'error', message: e.message || String(e) });
          });
        return () => { cancelled = true; };
      }, [isViewer]);

      // === Auth state listener(規劃者 Google + 觀看者匿名)===
      useEffect(() => {
        if (!auth) return;
        const unsub = auth.onAuthStateChanged(async (u) => {
          if (isViewer && !u) {
            try {
              await auth.signInAnonymously();
              return; // 等下一輪 onAuthStateChanged
            } catch (e) {
              console.error('[Auth] anonymous sign-in failed', e);
              setAppError('匿名登入失敗:' + (e.message || e));
              setAuthReady(true);
              return;
            }
          }
          setUser(u);
          setAuthReady(true);
        });
        return unsub;
      }, [isViewer]);

      // === 規劃者:載入或建立 profile ===
      useEffect(() => {
        if (isViewer || !user) return;
        setProfileLoading(true);
        let unsub = null;
        (async () => {
          try {
            const ref = paths.user(user.uid);
            const snap = await ref.get();
            if (!snap.exists) {
              // 首次登入:建立 profile + shared_family
              const baseName = user.displayName || (user.email && user.email.split('@')[0]) || 'User';
              const baseCode = generateFamilyShareCode(baseName);
              const code = await ensureUniqueFamilyShareCode(baseCode, user.uid);
              const newProfile = {
                nickname: baseName,
                email: user.email || '',
                icon: '🚙',
                color: '#3B82F6',
                familyShareCode: code,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              };
              await ref.set(newProfile);
              await paths.sharedFamily(code).set({
                ownerUid: user.uid,
                ownerName: baseName,
                activeTripId: null,
                recentTrips: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              });
              console.log('[Profile] created for new user', { uid: user.uid, code });
            }
            unsub = ref.onSnapshot((doc) => {
              if (doc.exists) setProfile(doc.data());
              setProfileLoading(false);
            }, (e) => {
              console.error('[Profile] listener error', e);
              setProfileLoading(false);
            });
          } catch (e) {
            console.error('[Profile] setup failed', e);
            setAppError('個人資料載入失敗:' + (e.message || e) + '\n\n可能原因:Firestore 規則未正確設定。');
            setProfileLoading(false);
          }
        })();
        return () => { if (unsub) unsub(); };
      }, [isViewer, user]);

      // === 觀看者:讀取家庭資訊 ===
      useEffect(() => {
        if (!isViewer || !user) return;
        paths.sharedFamily(familyCodeUrl).get()
          .then((snap) => {
            if (!snap.exists) {
              setFamilyOwnerError(`找不到分享碼「${familyCodeUrl}」,請確認網址是否正確`);
              return;
            }
            setFamilyOwner({ shareCode: familyCodeUrl, ...snap.data() });
          })
          .catch((e) => {
            console.error('[Viewer] load family failed', e);
            setFamilyOwnerError('讀取家庭資訊失敗:' + (e.message || e));
          });
      }, [isViewer, user, familyCodeUrl]);

      // === 觀看者:檢查 localStorage 是否已有 profile ===
      useEffect(() => {
        if (!isViewer || !familyCodeUrl || !user) return;
        const key = LS_VIEWER_PROFILE_PREFIX + familyCodeUrl;
        const stored = lsGet(key);
        if (stored) {
          try {
            const p = JSON.parse(stored);
            setViewerProfile(p);
            return;
          } catch (_) { /* fall through */ }
        }
        setNeedsFamilySetup(true);
      }, [isViewer, familyCodeUrl, user]);

      // === 觀看者:訂閱當前活躍行程 ===
      useEffect(() => {
        if (!isViewer || !familyOwner) return;
        if (!familyOwner.activeTripId) {
          setSharedTripData(null);
          return;
        }
        const unsub = paths.sharedTrip(familyOwner.activeTripId).onSnapshot(
          (doc) => {
            if (doc.exists) setSharedTripData({ id: doc.id, ...doc.data() });
            else setSharedTripData(null);
          },
          (e) => console.warn('[Viewer] shared_trips listener', e)
        );
        return unsub;
      }, [isViewer, familyOwner]);

      // === Handlers ===
      const handleGoogleLogin = async () => {
        setGoogleBusy(true);
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await auth.signInWithPopup(provider);
        } catch (e) {
          console.error('[Auth] Google login failed', e);
          if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
            // 使用者自己關掉,不噴錯
          } else if (e.code === 'auth/popup-blocked') {
            alert('瀏覽器阻擋了登入彈窗,請允許彈出視窗後重試');
          } else {
            alert('登入失敗:' + (e.message || e));
          }
        } finally {
          setGoogleBusy(false);
        }
      };

      const handleFamilySetupComplete = async ({ nickname, icon, color, shareLocation }) => {
        if (!user || !familyOwner) throw new Error('尚未準備好');

        // 1. 寫入 known_family(在規劃者空間)
        await paths.knownFamilyMember(familyOwner.ownerUid, user.uid).set({
          nickname,
          icon,
          color,
          shareLocation,
          firstSeenAt: firebase.firestore.FieldValue.serverTimestamp(),
          lastSeenAt: firebase.firestore.FieldValue.serverTimestamp(),
          totalTrips: 1,
        }, { merge: true });

        // 2. 若有活躍行程,寫入 participants
        if (familyOwner.activeTripId) {
          try {
            await paths.participant(familyOwner.activeTripId, user.uid).set({
              nickname,
              icon,
              color,
              shareLocation,
              lastUpdate: firebase.firestore.FieldValue.serverTimestamp(),
            }, { merge: true });
          } catch (e) {
            console.warn('[Viewer] participant write failed', e);
          }
        }

        // 3. localStorage(裝置記住,下次不再問)
        const profileObj = { nickname, icon, color, shareLocation };
        lsSet(LS_VIEWER_PROFILE_PREFIX + familyCodeUrl, JSON.stringify(profileObj));
        setViewerProfile(profileObj);
        setNeedsFamilySetup(false);
      };

      // === Render ===
      if (appError) {
        return <ErrorScreen
          title="無法啟動"
          message={appError}
          hint="請確認 config.js 設定正確,且 Firestore 安全規則已部署最新版本"
        />;
      }

      if (!authReady) return <LoadingScreen message="正在連線 Firebase..." />;

      // === 觀看者模式 ===
      if (isViewer) {
        if (familyOwnerError) return <ErrorScreen title="無法載入家庭資訊" message={familyOwnerError} />;
        if (!familyOwner) return <LoadingScreen message="載入家庭資訊..." />;
        if (needsFamilySetup) {
          return (
            <FamilyJoinModal
              ownerName={familyOwner.ownerName}
              onComplete={handleFamilySetupComplete}
            />
          );
        }
        return (
          <MobileTripView
            user={user}
            ownerName={familyOwner.ownerName}
            viewerProfile={viewerProfile}
            sharedTripData={sharedTripData}
            isViewer={true}
          />
        );
      }

      // === 規劃者模式 ===
      if (!user) return <LoginScreen onLogin={handleGoogleLogin} busy={googleBusy} />;
      if (profileLoading || !profile) return <LoadingScreen message="載入個人資料..." />;

      switch (route.view) {
        case 'family_list': return <FamilyListPage user={user} profile={profile} />;
        case 'editor': return <EditorView user={user} profile={profile} tripId={route.tripId} twPOIs={twPOIs} poiState={poiState} />;
        case 'mobile_view': return <MobileTripView user={user} profile={profile} tripId={route.tripId} twPOIs={twPOIs} poiState={poiState} isViewer={false} />;
        case 'settings': return <SettingsPage user={user} profile={profile} />;
        default: return <Dashboard user={user} profile={profile} />;
      }
    }

    // ================================================================
    // Render
    // ================================================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
